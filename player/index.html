<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />

<style>
/* ============================================================
   MANDARIN ORIENTAL — P&C PLAYBOOK · MAGAZINE EDITION V2
   Aesthetic: "Luxury Living" — white pages, condensed display
   serif, single thin gold hairline, large numeric anchors,
   photography-forward, quiet luxury.
   ============================================================ */

:root {
  /* Palette — cool, gallery-clean */
  --paper: #FFFFFF;
  --paper-warm: #FAF9F6;      /* subtle warm variant for cards */
  --paper-tint: #F5F3EE;      /* the rare inset panel */
  --ink: #0d0b08;
  --ink-body: #262220;
  --ink-mute: #6b625a;
  --ink-fade: #a89f92;
  --rule: #E5E2DA;
  --rule-strong: #C9C4B8;
  --gold: #B59060;
  --gold-deep: #8f6d3f;
  --gold-hair: #C9A879;       /* the signature thin rule */
  --mo-red: #8B1E2C;
  --celadon: #7C917F;         /* MO celadon green — secondary accent */
  --celadon-deep: #5C7062;    /* deeper celadon for text/contrast */
  --celadon-hair: #A9BBAC;    /* soft celadon hairline */
  --celadon-tint: #EDF1EC;    /* pale celadon wash for panels */
  --shadow-hair: 0 1px 0 rgba(13,11,8,0.04);
  --shadow-card: 0 1px 2px rgba(13,11,8,0.03), 0 12px 32px rgba(13,11,8,0.06);
  --rail-w: 260px;
}

* { box-sizing: border-box; }

/* ---- Vertical timeline (numbered steps on a gold rail) ---- */
.pb-timeline { position: relative; margin: 22px 0 10px; }
.pb-timeline::before { content: ""; position: absolute; left: 21px; top: 18px; bottom: 18px; width: 1px; background: var(--gold-hair); }
.pb-step { position: relative; padding: 4px 0 10px 62px; }
.pb-step-head { display: flex; align-items: center; width: 100%; background: none; border: 0; padding: 8px 0; cursor: pointer; text-align: left; }
.pb-timeline[data-mode="all"] .pb-step-head { cursor: default; }
.pb-step-num { position: absolute; left: 0; top: 4px; width: 43px; height: 43px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "MO Exceptional", "Times New Roman", serif; font-size: 19px; color: var(--gold-deep); background: var(--paper); border: 1px solid var(--gold-hair); transition: background .25s, color .25s, border-color .25s; z-index: 1; }
.pb-step.open .pb-step-num { background: var(--gold); border-color: var(--gold); color: #fff; }
.pb-timeline[data-mode="all"] .pb-step.open .pb-step-num { background: var(--paper); border-color: var(--gold-hair); color: var(--gold-deep); }
.pb-step-label { font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink); }
.pb-step-body { font-size: 14.5px; line-height: 1.7; color: var(--ink-body); padding: 2px 0 14px; }
.pb-step-body p { margin: 0 0 8px; }
.pb-timeline[data-mode="reveal"] .pb-step-body { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; transition: max-height .35s ease, opacity .25s ease, padding .3s ease; }
.pb-timeline[data-mode="reveal"] .pb-step.open .pb-step-body { max-height: 800px; opacity: 1; padding: 2px 0 14px; }
.pb-step-link { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--gold-deep); text-decoration: none; border-bottom: 1px solid var(--gold-hair); padding-bottom: 2px; }
.pb-step-link:hover { color: var(--gold); border-bottom-color: var(--gold); }

/* ---- Checklist (tickable resource list) ---- */
.pb-checklist { margin: 18px 0; border-top: 1px solid var(--rule); }
.pb-check { display: flex; align-items: flex-start; gap: 14px; padding: 13px 6px; border-bottom: 1px solid var(--rule); transition: background .2s; }
.pb-check:hover { background: var(--paper-warm); }
.pb-check-box { flex: none; width: 22px; height: 22px; margin-top: 1px; padding: 0; border: 1px solid var(--rule-strong); border-radius: 3px; background: var(--paper); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s; }
.pb-check-box span { font-size: 13px; line-height: 1; color: transparent; transform: scale(.5); transition: color .15s, transform .2s; }
.pb-check.done .pb-check-box { background: var(--celadon-deep); border-color: var(--celadon-deep); }
.pb-check.done .pb-check-box span { color: #fff; transform: scale(1); }
.pb-check-text { font-size: 14.5px; line-height: 1.6; color: var(--ink-body); transition: color .2s; }
.pb-check-text a { color: var(--gold-deep); text-decoration: none; border-bottom: 1px solid var(--gold-hair); }
.pb-check-text a:hover { color: var(--gold); border-bottom-color: var(--gold); }
.pb-check.done .pb-check-text { color: var(--ink-fade); text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.pb-check.done .pb-check-text a { color: var(--ink-fade); border-bottom-color: transparent; }

/* ---- Swimlane timeline (role lanes, steps flowing left to right) ---- */
.pb-swim { margin: 22px 0 10px; border-top: 1px solid var(--rule); }
.pb-swim-row { display: grid; grid-template-columns: 150px minmax(0,1fr); border-bottom: 1px solid var(--rule); }
.pb-swim-role { display: flex; align-items: flex-start; gap: 10px; padding: 18px 16px 18px 2px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--celadon-deep); border-right: 1px solid var(--rule); line-height: 1.5; }
.pb-swim-role-num { font-family: "MO Exceptional", "Times New Roman", serif; font-size: 15px; font-weight: 400; color: var(--gold-hair); flex: none; }
.pb-swim-steps { position: relative; display: flex; flex-wrap: wrap; gap: 14px; padding: 16px 18px; }
.pb-swim-hand { position: absolute; top: -9px; left: 26px; width: 17px; height: 17px; border-radius: 50%; background: var(--gold); color: #fff; font-size: 10px; line-height: 17px; text-align: center; z-index: 1; }
.pb-swim-step { position: relative; flex: 1 1 180px; max-width: 320px; display: flex; gap: 10px; align-items: flex-start; }
.pb-swim-num { flex: none; width: 30px; height: 30px; margin-top: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "MO Exceptional", "Times New Roman", serif; font-size: 14px; color: var(--gold-deep); background: var(--paper); border: 1px solid var(--gold-hair); }
.pb-swim-step + .pb-swim-step::before { content: ""; position: absolute; left: -14px; top: 25px; width: 14px; height: 1px; background: var(--gold-hair); }
.pb-swim-card { flex: 1; min-width: 0; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 11px 14px; box-shadow: var(--shadow-hair); }
.pb-swim-label { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.pb-swim-text { margin-top: 5px; font-size: 13.5px; line-height: 1.6; color: var(--ink-mute); }
@media (max-width: 720px) {
  .pb-swim-row { grid-template-columns: 1fr; }
  .pb-swim-role { border-right: 0; border-bottom: 1px dashed var(--rule); padding-bottom: 10px; }
  .pb-swim-steps { flex-direction: column; }
  .pb-swim-step { max-width: none; }
  .pb-swim-step + .pb-swim-step::before { left: 15px; top: -14px; width: 1px; height: 14px; }
}

/* ---- Chart / dashboard block (branded SVG, no library) ---- */
.pb-chart { margin: 20px 0 12px; padding: 18px 20px 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow-hair); }
.pb-chart svg { display: block; width: 100%; height: auto; }
.pb-chart text { font-family: "Avenir Next LT Pro", system-ui, sans-serif; }
.pb-chart-empty { padding: 18px; font-size: 13px; color: var(--ink-mute); }
.pb-chart-grid { stroke: var(--rule); stroke-width: 1; }
.pb-chart-base { stroke: var(--rule-strong); }
.pb-chart-tick { font-size: 11px; fill: var(--ink-mute); }
.pb-chart-val { font-size: 11px; font-weight: 600; fill: var(--ink-body); }
.pb-chart-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 10px; }
.pb-chart-legitem { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-mute); }
.pb-chart-chip { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.pb-chart-donutwrap { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
.pb-chart-donutwrap svg { width: 240px; flex: none; }
.pb-chart-legcol { flex: 1; min-width: 200px; }
.pb-chart-legrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.pb-chart-legrow:last-child { border-bottom: 0; }
.pb-chart-leglabel { flex: 1; font-size: 13px; color: var(--ink-body); }
.pb-chart-legval { font-size: 12px; font-weight: 600; color: var(--ink-mute); }
.pb-chart-big { font-family: "MO Exceptional", "Times New Roman", serif; font-size: 26px; fill: var(--ink); }
.pb-chart-bigsub { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; fill: var(--ink-mute); }

/* ---- Before / after comparison (drag slider + text cards) ---- */
.pb-bawrap { margin: 20px 0 12px; }
.pb-ba { position: relative; margin: 0; overflow: hidden; border-radius: 8px; border: 1px solid var(--rule); box-shadow: var(--shadow-card); touch-action: pan-y; user-select: none; }
.pb-ba img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; pointer-events: none; }
.pb-ba-top { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; clip-path: inset(0 calc(100% - var(--ba, 50%)) 0 0); }
.pb-ba-handle { position: absolute; top: 0; bottom: 0; left: var(--ba, 50%); width: 0; z-index: 2; }
.pb-ba-handle::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(13,11,8,.12); }
.pb-ba-btn { position: absolute; top: 50%; left: 0; transform: translate(-50%,-50%); width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff; background: var(--gold); color: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 2px; cursor: ew-resize; box-shadow: 0 4px 14px rgba(13,11,8,.3); }
.pb-ba-tag { position: absolute; top: 12px; z-index: 1; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: rgba(13,11,8,.55); padding: 5px 11px; border-radius: 999px; }
.pb-ba-tag--b { left: 12px; }
.pb-ba-tag--a { right: 12px; }
.pb-ba-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.pb-bawrap > .pb-ba-cards:first-child { margin-top: 0; }
.pb-ba-card { border: 1px solid var(--rule); border-radius: 8px; padding: 16px 20px; background: var(--paper-tint); }
.pb-ba-card--a { background: var(--paper); border-color: var(--gold-hair); box-shadow: var(--shadow-hair); }
.pb-ba-eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 8px; }
.pb-ba-card--a .pb-ba-eyebrow { color: var(--gold-deep); }
.pb-ba-line { display: flex; gap: 9px; align-items: baseline; font-size: 14px; line-height: 1.65; color: var(--ink-body); padding: 3px 0; }
.pb-ba-mark { flex: none; color: var(--ink-fade); font-weight: 600; }
.pb-ba-card--a .pb-ba-mark { color: var(--celadon-deep); }
.pb-ba-empty { padding: 16px 18px; border: 1px dashed var(--rule-strong); border-radius: 8px; font-size: 13px; color: var(--ink-mute); }
@media (max-width: 720px) {
  .pb-ba-cards { grid-template-columns: 1fr; }
}
/* --- Standalone heading element + optional per-element header --- */
.pb-item-head { font-family: 'MO Exceptional', 'Didot', serif; font-size: 24px; color: var(--ink); margin: 30px 0 12px; line-height: 1.25; }
.pb-heading { margin: 34px 0 8px; }
.pb-heading-sub { font-size: 10.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 6px; }
.pb-heading-text { font-family: 'MO Exceptional', 'Didot', serif; font-size: 30px; font-weight: 400; color: var(--ink); margin: 0; line-height: 1.2; }
.pb-heading-rule { display: block; height: 1px; background: var(--rule); margin-top: 14px; }
/* --- Stat / KPI band --- */
.pb-stats { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: #fff; box-shadow: var(--shadow-card); margin: 20px 0; }
.pb-stat { padding: 26px 24px 22px; border-left: 1px solid var(--rule); position: relative; }
.pb-stat:first-child { border-left: none; }
.pb-stat::before { content: ""; position: absolute; top: 0; left: 24px; width: 26px; height: 3px; background: var(--gold); border-radius: 0 0 3px 3px; }
.pb-stat-num { font-family: 'MO Exceptional', 'Didot', serif; font-size: 46px; line-height: 1; color: var(--ink); display: flex; align-items: baseline; gap: 3px; }
.pb-stat-unit { font-size: 20px; color: var(--gold-deep); }
.pb-stat-label { margin-top: 9px; font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-body); }
.pb-stat-sub { margin-top: 4px; font-size: 12.5px; color: var(--ink-mute); }
.pb-stat-delta { margin-top: 8px; font-size: 11.5px; font-weight: 700; color: var(--celadon-deep); }
.pb-stat-delta.down { color: var(--gold-deep); }
@media (max-width: 720px) {
  .pb-stats { grid-template-columns: 1fr 1fr; }
  .pb-stat:nth-child(3) { border-left: none; }
  .pb-stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
/* --- Gauge / maturity meter --- */
.pb-gauge-card { border: 1px solid var(--rule); border-radius: 10px; background: #fff; box-shadow: var(--shadow-card); padding: 30px 34px; display: flex; gap: 48px; align-items: center; margin: 20px 0; }
.pb-gauge-svgwrap { flex: none; width: 340px; max-width: 100%; }
.pb-gauge-svgwrap svg { width: 100%; height: auto; display: block; }
.pb-gauge-read { flex: 1; min-width: 0; }
.pb-gauge-level { font-family: 'MO Exceptional', 'Didot', serif; font-size: 28px; color: var(--ink); line-height: 1.2; }
.pb-gauge-of { font-size: 13px; color: var(--ink-mute); margin-top: 4px; }
.pb-gauge-scale { margin-top: 20px; display: flex; flex-direction: column; gap: 7px; }
.pb-gauge-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-mute); }
.pb-gauge-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rule-strong); flex: none; }
.pb-gauge-row.now { color: var(--ink); font-weight: 700; }
.pb-gauge-row.now .dot { background: var(--gold); box-shadow: 0 0 0 3px rgba(181,144,96,.22); }
@media (max-width: 720px) {
  .pb-gauge-card { flex-direction: column; gap: 22px; padding: 24px 20px; }
}
/* --- Hierarchy / pyramid --- */
.pb-pyr { display: flex; gap: 44px; align-items: center; margin: 20px 0; }
.pb-pyr-stack { flex: 1.15; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.pb-pyr-tier { min-height: 68px; padding: 10px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; border-radius: 6px; clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%); }
.pb-pyr-tier .t-name { font-family: 'MO Exceptional', 'Didot', serif; font-size: 18px; letter-spacing: .02em; }
.pb-pyr-tier .t-sub { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; opacity: .82; margin-top: 2px; }
.pb-pyr-tier.light { color: var(--ink); }
.pb-pyr-tier.light .t-sub { color: var(--ink-body); opacity: .75; }
.pb-pyr-notes { flex: 1; display: flex; flex-direction: column; gap: 13px; min-width: 0; }
.pb-pyr-note { display: flex; gap: 13px; align-items: baseline; font-size: 13.5px; line-height: 1.55; color: var(--ink-body); }
.pb-pyr-note .swatch { flex: none; width: 11px; height: 11px; border-radius: 3px; transform: translateY(1px); }
.pb-pyr-note b { color: var(--ink); }
@media (max-width: 720px) {
  .pb-pyr { flex-direction: column; gap: 22px; align-items: stretch; }
}
/* --- Radial lifecycle wheel --- */
.pb-wheelwrap { display: flex; gap: 52px; align-items: center; margin: 24px 0; }
.pb-wheel { flex: none; width: 460px; max-width: 100%; position: relative; }
.pb-wheel svg { width: 100%; height: auto; display: block; }
.pb-wheel-seg { cursor: pointer; opacity: .88; transition: opacity .15s ease; outline: none; }
.pb-wheel-seg:hover, .pb-wheel-seg:focus-visible { opacity: 1; }
.pb-wheel-seg.on { fill: var(--gold); opacity: 1; }
.pb-wheel-num { font-family: 'MO Exceptional', 'Didot', serif; font-size: 13px; font-weight: 700; fill: #fff; pointer-events: none; }
.pb-wheel-lbl { font-family: 'Avenir Next LT Pro', 'Avenir Next', sans-serif; font-size: 9px; letter-spacing: .08em; fill: rgba(255,255,255,.94); pointer-events: none; }
.pb-wheel-hub { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.pb-wheel-hub .h-eyebrow { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-deep); font-weight: 700; }
.pb-wheel-hub .h-title { font-family: 'MO Exceptional', 'Didot', serif; font-size: 22px; color: var(--ink); margin-top: 6px; max-width: 180px; line-height: 1.2; }
.pb-wheel-side { flex: 1; min-width: 0; }
.pb-wheel-stage { border: 1px solid var(--gold-hair); border-radius: 10px; background: #fff; padding: 20px 24px; box-shadow: var(--shadow-card); }
.pb-wheel-stage .s-num { font-family: 'MO Exceptional', 'Didot', serif; font-size: 14px; color: var(--gold-deep); }
.pb-wheel-stage .s-name { font-family: 'MO Exceptional', 'Didot', serif; font-size: 21px; color: var(--ink); margin: 3px 0 7px; }
.pb-wheel-stage .s-text { font-size: 13.5px; line-height: 1.6; color: var(--ink-body); }
.pb-wheel-hint { margin-top: 14px; font-size: 12px; color: var(--ink-mute); }
@media (max-width: 760px) {
  .pb-wheelwrap { flex-direction: column; gap: 20px; align-items: stretch; }
  .pb-wheel { width: min(420px, 100%); margin: 0 auto; }
  .pb-wheel-side .pb-wheel-stage { display: block !important; margin-bottom: 10px; }
  .pb-wheel-hint { display: none; }
}
/* ============================================================
   Process diagram chapter (author-provided MO Luminous Cards v2
   directory) — scoped under .mo-opp; ground wrapper .mo-opp-ground.
   ============================================================ */

/* ============================================================
   MO LUMINOUS CARDS v2 — OPPORTUNITIES INTERACTIVE DIRECTORY
   Style lock: pale sage mist ground, pure-white mega panel,
   sage/gold diagram grammar, gold line icons in ivory circles,
   MO Exceptional display / Avenir Next LT Pro interface.
   Desktop: 4-column card grid. Mobile (<=620px): accordion
   directory. Scoped under .mo-opp for collision-free embedding.
   ============================================================ */

:root {
  --mo-mist:      #DFE6E1;
  --mo-white:     #FFFFFF;
  --mo-gold:      #B59060;
  --mo-cream:     #F1E9DB;
  --mo-sage:      #749D8A;
  --mo-sage-deep: #68806F;
  --mo-sage-chip: #D3E2DA;
  --mo-ivory:     #FDFDF3;
  --mo-ink:       #232323;
  --mo-grey:      #8E938E;
  --mo-hairline:  #E4EAE6;
  --mo-shadow:    rgba(104, 128, 111, 0.22);
  --mo-pop:       cubic-bezier(0.22, 0.9, 0.28, 1.12); /* calm ease-out-back */
}




/* the mist ground (their body background, scoped to the diagram wrapper) */
.mo-opp-ground {
  background:
    radial-gradient(120% 70% at 50% -18%, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(180deg, #E4EAE5 0%, #DFE6E1 46%, #D3DCD6 100%);
  border-radius: 8px;
  padding: clamp(20px, 3vw, 44px) clamp(14px, 3vw, 40px);
  display: flex;
  justify-content: center;
}

/* ---------- component root ---------- */
.mo-opp { width: 100%; max-width: 1240px; }

/* ---------- header ---------- */
.mo-opp__header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
  margin-bottom: clamp(28px, 3.4vw, 44px);
  animation: mo-pop 0.6s var(--mo-pop) both;
}
.mo-opp__eyebrow {
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--mo-gold);
  margin-bottom: 14px;
}
.mo-opp__title {
  font-family: 'MO Exceptional', 'Avenir Next LT Pro', sans-serif;
  font-weight: 400;
  font-size: clamp(26px, 3.2vw, 40px);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--mo-ink);
  line-height: 1.16;
}
.mo-opp__subline {
  font-weight: 300;
  font-size: clamp(14px, 1.25vw, 16.5px);
  color: var(--mo-grey);
  margin-top: 12px;
  max-width: 56ch;
  line-height: 1.5;
}

/* the single focal gold pill */
.mo-opp__pill {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--mo-gold);
  color: #fff;
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 13px 22px;
  border-radius: 999px;
  box-shadow: 0 10px 24px -10px rgba(181, 144, 96, 0.65);
  white-space: nowrap;
}
.mo-opp__pill::after {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
}

/* ---------- mega panel ---------- */
.mo-opp__panel {
  background: var(--mo-white);
  border-radius: 28px;
  box-shadow: 0 34px 70px -28px var(--mo-shadow), 0 10px 26px -14px rgba(104,128,111,0.16);
  padding: clamp(30px, 4vw, 58px) clamp(22px, 3.6vw, 56px) clamp(24px, 3vw, 40px);
  animation: mo-pop 0.65s var(--mo-pop) 0.12s both;
}

/* ---------- the directory grid ---------- */
.mo-opp__grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); /* minmax(0,…) stops long cards blowing out the row */
  gap: clamp(16px, 1.8vw, 26px);
  padding-top: 34px; /* room for spine + node */
}
/* six or more sections: a single spine row no longer reads well — switch to a
   clean 3-column card grid (numbers carry the ordering instead of the spine) */
.mo-opp__grid--many { grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 26px; }
.mo-opp__grid--many::before { display: none; }
.mo-opp__grid--many .mo-opp__col::before,
.mo-opp__grid--many .mo-opp__col::after { display: none; }
/* sage spine joining the four section nodes (wide layouts only) */
.mo-opp__grid::before {
  content: '';
  position: absolute;
  top: 5px; /* vertically centred on the node dots (dot centre = 6.5px) */
  left: calc(50% / var(--cols, 4));  /* centre of the first column, any count */
  right: calc(50% / var(--cols, 4)); /* centre of the last column, any count */
  height: 3px;
  border-radius: 2px;
  background: var(--mo-sage);
  opacity: 0.55;
  transform-origin: left center;
  animation: mo-spine 0.9s cubic-bezier(0.3, 0.7, 0.3, 1) 0.55s both;
}

.mo-opp__col { position: relative; display: flex; flex-direction: column; min-width: 0; }

/* gold node dot + sage stem above each section card */
.mo-opp__col::before {
  content: '';
  position: absolute;
  top: -34px;
  left: 50%;
  transform: translateX(-50%);
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--mo-gold);
  border: 3px solid var(--mo-white);
  box-shadow: 0 0 0 1.5px rgba(181,144,96,0.4);
  z-index: 2;
  animation: mo-pop 0.45s var(--mo-pop) calc(0.5s + var(--d, 0s)) both;
}
.mo-opp__col::after {
  content: '';
  position: absolute;
  top: -21px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px; height: 21px;
  border-radius: 2px;
  background: var(--mo-sage);
  opacity: 0.55;
  animation: mo-fade 0.4s ease calc(0.55s + var(--d, 0s)) both;
}

/* ---------- section card ---------- */
.mo-opp__section {
  min-width: 0;
  background: var(--mo-white);
  border: 1px solid var(--mo-hairline);
  border-radius: 20px;
  padding: 22px 20px 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
  box-shadow: 0 14px 30px -18px rgba(104,128,111,0.28);
  transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  animation: mo-pop 0.55s var(--mo-pop) calc(0.35s + var(--d, 0s)) both;
}
.mo-opp__section:hover {
  border-color: rgba(181,144,96,0.55);
  box-shadow: 0 22px 40px -18px rgba(104,128,111,0.38);
  transform: translateY(-3px);
}

/* head/body wrappers vanish on desktop (layout identical to v1) */
.mo-opp__head,
.mo-opp__head-text,
.mo-opp__body,
.mo-opp__body-inner { display: contents; }
/* button UA styles inherit through display:contents — neutralise */
.mo-opp__head { text-align: left; font: inherit; color: inherit; }
.mo-opp__head-meta,
.mo-opp__chevron { display: none; }

.mo-opp__section-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.mo-opp__icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--mo-ivory);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.mo-opp__icon svg { display: block; }
.mo-opp__icon svg * {
  stroke: var(--mo-gold);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.mo-opp__num {
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.14em;
  color: var(--mo-gold);
}

.mo-opp__section-label {
  display: block;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--mo-grey);
  margin-bottom: 7px;
}
.mo-opp__section-name {
  display: block;
  font-family: 'MO Exceptional', 'Avenir Next LT Pro', sans-serif;
  font-weight: 400;
  font-size: clamp(15px, 1.35vw, 18px);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--mo-ink);
  line-height: 1.3;
  min-height: 2.6em; /* keeps opportunity rows level across columns */
  margin-bottom: 12px;
}
.mo-opp__count {
  align-self: flex-start;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: var(--mo-sage-chip);
  color: var(--mo-sage-deep);
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 999px;
  margin-bottom: 14px;
}

/* ---------- opportunity rows (the links) ---------- */
.mo-opp__link {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  background: var(--mo-white);
  border: 1px solid var(--mo-hairline);
  border-radius: 14px;
  padding: 12px 14px;
  margin-top: 10px;
  transition: background 0.22s ease, border-color 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
  animation: mo-pop 0.5s var(--mo-pop) calc(0.62s + var(--d, 0s)) both;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.mo-opp__link:first-of-type { margin-top: 0; }
.mo-opp__link:hover {
  background: var(--mo-cream);          /* cream selected-state fill */
  border-color: var(--mo-gold);
  transform: translateX(3px);
  box-shadow: 0 10px 22px -12px rgba(181,144,96,0.5);
}
.mo-opp__link:focus-visible {
  outline: 2px solid var(--mo-gold);
  outline-offset: 2px;
  background: var(--mo-cream);
  border-color: var(--mo-gold);
}
.mo-opp__link:active {
  background: var(--mo-cream);
  border-color: var(--mo-gold);
}
.mo-opp__link-num {
  flex: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--mo-cream);
  color: var(--mo-gold);
  font-weight: 800;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.22s ease, color 0.22s ease;
}
.mo-opp__link:hover .mo-opp__link-num,
.mo-opp__link:focus-visible .mo-opp__link-num,
.mo-opp__link:active .mo-opp__link-num {
  background: var(--mo-gold);
  color: #fff;
}
.mo-opp__link-text { flex: 1; min-width: 0; }
.mo-opp__link-name {
  display: block;
  font-weight: 700;
  font-size: 13.5px;
  color: var(--mo-ink);
  line-height: 1.3;
}
.mo-opp__link-chapter {
  display: block;
  font-weight: 700;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mo-grey);
  margin-top: 4px;
}
.mo-opp__link-arrow { flex: none; transition: transform 0.22s ease; }
.mo-opp__link-arrow svg { display: block; }
.mo-opp__link-arrow svg * {
  stroke: var(--mo-gold);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.mo-opp__link:hover .mo-opp__link-arrow { transform: translateX(4px); }

/* ---------- panel footer ---------- */
.mo-opp__footer {
  margin-top: clamp(24px, 3vw, 38px);
  padding-top: 20px;
  border-top: 1px solid var(--mo-hairline);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: mo-fade 0.6s ease 1.15s both;
}
.mo-opp__footer svg { flex: none; display: block; }
.mo-opp__footer svg circle { fill: var(--mo-sage-deep); }
.mo-opp__footer svg path {
  stroke: #fff; stroke-width: 2.4;
  stroke-linecap: round; stroke-linejoin: round; fill: none;
}
.mo-opp__footer p {
  font-weight: 300;
  font-size: 13.5px;
  color: var(--mo-grey);
  line-height: 1.5;
}

/* ---------- entrances ---------- */
@keyframes mo-pop {
  from { opacity: 0; transform: translateY(24px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
@keyframes mo-fade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes mo-spine {
  from { opacity: 0; transform: scaleX(0); }
  to   { opacity: 0.55; transform: scaleX(1); }
}
.mo-opp__section, .mo-opp__link { animation-fill-mode: both; }

@media (prefers-reduced-motion: reduce) {
  .mo-opp *, .mo-opp *::before, .mo-opp *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ---------- tablet: 2x2 ---------- */
@media (max-width: 1080px) {
  .mo-opp__grid { grid-template-columns: repeat(2, 1fr); padding-top: 26px; }
  .mo-opp__grid::before { display: none; }
  .mo-opp__col::before { top: -26px; }
  .mo-opp__col::after  { top: -13px; height: 13px; }
  .mo-opp__section-name { min-height: 0; }
}

/* ---------- mobile: accordion directory ---------- */
@media (max-width: 620px) {

  /* minimal header */
  .mo-opp__header { margin-bottom: 18px; gap: 0; }
  .mo-opp__eyebrow { font-size: 10px; letter-spacing: 0.18em; margin-bottom: 8px; }
  .mo-opp__title { font-size: 15px; letter-spacing: 0.05em; line-height: 1.4; }
  .mo-opp__title br { display: none; }
  .mo-opp__subline { display: none; }
  .mo-opp__pill { display: none; }

  .mo-opp__panel { border-radius: 20px; padding: 14px 12px 16px; }

  .mo-opp__grid { display: flex; flex-direction: column; gap: 10px; padding-top: 0; }
  .mo-opp__grid::before { display: none; }
  .mo-opp__col::before, .mo-opp__col::after { display: none; }
  .mo-opp__col { display: block; }

  /* card becomes an accordion item */
  .mo-opp__section { padding: 0; border-radius: 16px; overflow: hidden; }
  .mo-opp__section:hover { transform: none; }
  .mo-opp__section.open {
    border-color: var(--mo-gold);
    box-shadow: 0 18px 34px -18px rgba(104,128,111,0.4);
  }

  /* head becomes the tappable row */
  .mo-opp__head {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    padding: 15px 16px;
    background: none;
    border: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .mo-opp__head:focus-visible { outline: 2px solid var(--mo-gold); outline-offset: -2px; }
  .mo-opp__section-top { margin-bottom: 0; }
  .mo-opp__icon { width: 44px; height: 44px; }
  .mo-opp__icon svg { width: 24px; height: 24px; }
  .mo-opp__num { display: none; }

  .mo-opp__head-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .mo-opp__section-label { display: none; }
  .mo-opp__head-meta {
    display: block;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mo-grey);
  }
  .mo-opp__section-name {
    font-size: 14px;
    letter-spacing: 0.06em;
    min-height: 0;
    margin-bottom: 0;
  }
  .mo-opp__count { display: none; }

  .mo-opp__chevron {
    display: flex;
    flex: none;
    transition: transform 0.3s ease;
  }
  .mo-opp__chevron svg { display: block; }
  .mo-opp__chevron svg * {
    stroke: var(--mo-gold);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  .mo-opp__section.open .mo-opp__chevron { transform: rotate(90deg); }

  /* collapsible body */
  .mo-opp__body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s cubic-bezier(0.3, 0.7, 0.3, 1);
  }
  .mo-opp__section.open .mo-opp__body { grid-template-rows: 1fr; }
  .mo-opp__body-inner {
    display: block;
    overflow: hidden;
    padding: 0 14px;
  }
  .mo-opp__section.open .mo-opp__body-inner { padding-bottom: 14px; }
  .mo-opp__link { padding: 13px 14px; }
  .mo-opp__link + .mo-opp__link { margin-top: 8px; }
  .mo-opp__link-name { font-size: 14px; }

  .mo-opp__footer { margin-top: 16px; padding-top: 14px; }
  .mo-opp__footer p { font-size: 12px; }
}


/* ---- Card track diagram (section / opportunity map) ---- */
.pb-track { position: relative; display: flex; gap: 18px; margin: 30px 0 12px; padding-top: 34px; }
.pb-track::before { content: ""; position: absolute; top: 7px; left: 6%; right: 6%; height: 1px; background: var(--celadon-hair); }
.pb-track-card { position: relative; flex: 1 1 0; min-width: 0; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 24px 18px 18px; box-shadow: var(--shadow-card); }
.pb-track-dot { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); width: 13px; height: 13px; margin-top: 1px; border-radius: 50%; background: var(--paper); border: 2px solid var(--gold); }
.pb-track-dot::after { content: ""; position: absolute; left: 50%; top: 13px; width: 1px; height: 20px; background: var(--celadon-hair); }
.pb-track-num { position: absolute; top: 14px; right: 16px; font-family: "MO Exceptional", "Times New Roman", serif; font-size: 16px; color: var(--gold-deep); }
.pb-track-icon { font-size: 20px; margin-bottom: 6px; }
.pb-track-label { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); }
.pb-track-title { font-family: "MO Exceptional", "Times New Roman", serif; font-size: 19px; line-height: 1.2; color: var(--ink); margin: 5px 0 10px; }
.pb-track-pill { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--celadon-tint); color: var(--celadon-deep); border-radius: 999px; padding: 4px 10px; margin-bottom: 12px; }
.pb-track-links { display: flex; flex-direction: column; gap: 8px; }
.pb-track-link { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--paper-warm); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; font: inherit; }
.pb-track-link:hover { border-color: var(--gold-hair); box-shadow: var(--shadow-hair); }
.pb-track-link-num { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
.pb-track-link-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.pb-track-arrow { color: var(--gold-deep); }
@media (max-width: 900px) {
  .pb-track { flex-direction: column; padding-top: 0; padding-left: 26px; gap: 14px; }
  .pb-track::before { top: 4%; bottom: 4%; left: 7px; right: auto; width: 1px; height: auto; }
  .pb-track-dot { top: 24px; left: -25px; transform: none; margin-top: 0; }
  .pb-track-dot::after { display: none; }
}

/* ---- Part hierarchy: rail third level + topic eyebrow offset ---- */
.rail-sub li.lvl2 { padding-left: 18px; }
.rail-sub li.lvl2 button { font-size: 0.86em; opacity: .82; }
.part-topic-eyebrow { margin-left: 22px; }
/* ---- Part hierarchy: rail fourth level (sub-sections) + nested eyebrows ---- */
.rail-sub li.lvl3 { padding-left: 34px; }
.rail-sub li.lvl3 button { font-size: 0.8em; opacity: .72; }
.part-sub-eyebrow { margin-left: 40px; }
.part-sub-eyebrow .txt { font-size: .85em; color: var(--ink-mute); }


/* ---- Data tables (imported or authored) ---- */
.pb-tablewrap { margin: 18px 0; overflow-x: auto; border: 1px solid var(--rule); border-radius: 4px; }
.pb-table { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 1.55; color: var(--ink-body); background: var(--paper); }
.pb-table thead th { background: var(--ink); color: #fff; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 12px 14px; }
.pb-table tbody td { padding: 11px 14px; border-top: 1px solid var(--rule); vertical-align: top; }
.pb-table tbody tr:nth-child(even) td { background: var(--paper-warm); }
.pb-table tbody td:first-child { font-weight: 600; color: var(--ink); }

/* ---- Callout panels ---- */
.pb-callout { margin: 18px 0; padding: 14px 18px 14px 16px; border-left: 3px solid var(--gold); background: var(--paper-tint); border-radius: 0 4px 4px 0; }
.pb-callout--warning { border-left-color: var(--mo-red); background: #F8EFEA; }
.pb-callout-label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 6px; }
.pb-callout--warning .pb-callout-label { color: var(--mo-red); }
.pb-callout-text { font-size: 14px; line-height: 1.65; color: var(--ink-body); }
/* ---- Checklist progress bar + expandable notes + completion ---- */
.pb-check-progress { display: flex; align-items: center; gap: 14px; padding: 4px 6px 14px; }
.pb-check-bar { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.pb-check-fill { height: 100%; width: 0%; background: var(--celadon-deep); transition: width .35s ease; }
.pb-check-count { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute); }
.pb-check.has-note { flex-wrap: wrap; }
.pb-check-more { display: inline-block; margin-left: 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-deep); cursor: pointer; }
.pb-check-note { display: none; flex: 1 0 100%; padding: 4px 4px 10px 36px; font-size: 13px; line-height: 1.65; color: var(--ink-mute); }
.pb-check.note-open .pb-check-note { display: block; }
.pb-check-done { display: none; margin-top: 14px; padding: 13px 18px; border: 1px solid var(--celadon-hair); background: var(--celadon-tint); color: var(--celadon-deep); border-radius: 4px; font-size: 13.5px; font-weight: 600; }
.pb-checklist.all-done .pb-check-done { display: block; }
/* ---- Gated task list (V5 pattern) ---- */
.pb-tasklist { margin: 18px 0; }
.pb-tl-progress { display: flex; align-items: center; gap: 14px; padding: 4px 6px 14px; }
.pb-tl-bar { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.pb-tl-fill { height: 100%; width: 0%; background: var(--celadon-deep); transition: width .35s ease; }
.pb-tl-count { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute); }
.pb-task { display: flex; align-items: flex-start; gap: 14px; padding: 14px 14px 14px 6px; border-bottom: 1px solid var(--rule); transition: background .2s; }
.pb-task:hover { background: var(--paper-warm); }
.pb-task-num { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--gold-deep); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
.pb-task.done .pb-task-num { background: var(--celadon-deep); border-color: var(--celadon-deep); color: #fff; }
.pb-task-body { flex: 1; min-width: 0; }
.pb-task-act { font-size: 14.5px; line-height: 1.55; color: var(--ink-body); font-weight: 600; }
.pb-task.done .pb-task-act { color: var(--ink-fade); text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.pb-task-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.pb-task-pill { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; border-radius: 999px; padding: 4px 11px; border: 1px solid var(--gold-hair); background: none; color: var(--gold-deep); cursor: pointer; font-family: inherit; transition: background .15s; }
.pb-task-pill:hover { background: #FBF7EE; }
.pb-task-pill.teal { border-color: var(--celadon-hair); color: var(--celadon-deep); }
.pb-task-pill.teal:hover { background: var(--celadon-tint); }
span.pb-task-pill { cursor: default; }
span.pb-task-pill:hover { background: none; }
.pb-task-note { display: none; margin-top: 8px; font-size: 13px; line-height: 1.65; color: var(--ink-mute); font-weight: 400; }
.pb-task.open .pb-task-note { display: block; }
.pb-task .pb-task-note p { margin: 0 0 6px; }
.pb-task-check { flex: none; width: 24px; height: 24px; margin-top: 2px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--paper); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .2s, border-color .2s; }
.pb-task-check span { font-size: 13px; color: transparent; transform: scale(.5); transition: color .15s, transform .2s; }
.pb-task.done .pb-task-check, .pb-task-gate.unlocked .pb-task-check { background: var(--celadon-deep); border-color: var(--celadon-deep); }
.pb-task.done .pb-task-check span, .pb-task-gate.unlocked .pb-task-check span { color: #fff; transform: scale(1); }
.pb-task-gate { border: 1px dashed var(--rule-strong); border-radius: 6px; margin-top: 12px; padding: 14px; }
.pb-task-gate.unlocked { border-style: solid; border-color: var(--celadon-hair); background: var(--celadon-tint); }
.pb-task-gate-num { border-style: dashed; color: var(--ink-mute); border-color: var(--rule-strong); }
.pb-task-gate.unlocked .pb-task-gate-num { border-style: solid; background: var(--celadon-deep); border-color: var(--celadon-deep); color: #fff; }
.pb-task-gatenote { margin-top: 4px; font-size: 12px; color: var(--ink-mute); }
.pb-task-gate.nudge { animation: pbTlNudge .35s ease; }
@keyframes pbTlNudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.pb-tl-saved { margin-top: 12px; font-size: 12px; color: var(--ink-fade); }
.pb-tl-reset { background: none; border: 0; color: var(--gold-deep); font: inherit; text-decoration: underline; cursor: pointer; padding: 0 2px; }


/* ---- Callout: recap tone (celadon) ---- */
.pb-callout--recap { border-left-color: var(--celadon-deep); background: var(--celadon-tint); }
.pb-callout--recap .pb-callout-label { color: var(--celadon-deep); }
/* ---- Callout: knowledge tip tone (warm beige) ---- */
.pb-callout--tip { border-left-color: var(--gold); background: #F7F0E1; }
.pb-callout--tip .pb-callout-label { color: var(--gold-deep); }




/* ---- Image lightbox (click any inline image to enlarge) ---- */
.inline-img img { cursor: zoom-in; }
.hotspot-wrap img { cursor: default; }
#pb-lightbox { position: fixed; inset: 0; z-index: 4000; background: rgba(13,11,8,0.88); display: flex; align-items: center; justify-content: center; cursor: zoom-out; animation: pbLightboxIn .18s ease; }
@keyframes pbLightboxIn { from { opacity: 0; } to { opacity: 1; } }
#pb-lightbox img { max-width: 94vw; max-height: 92vh; object-fit: contain; background: #fff; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
.pb-lightbox-close { position: absolute; top: 18px; right: 22px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; transition: background .15s; }
.pb-lightbox-close:hover { background: rgba(255,255,255,.22); }

/* ---- Broken-media placeholder ---- */
.pb-media-missing { display: flex; align-items: center; justify-content: center; min-height: 150px; margin: 16px 0; padding: 24px; background: var(--paper-tint); border: 1px dashed var(--rule-strong); border-radius: 4px; color: var(--ink-mute); font-size: 13px; line-height: 1.6; text-align: center; }
.pb-media-missing--img { min-height: 90px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

/* ---- Heading scale (Studio typography setting) ---- */
#reader .opener-title { font-size: clamp(calc(3rem * var(--pb-heading-scale, 1)), calc(6vw * var(--pb-heading-scale, 1)), calc(5rem * var(--pb-heading-scale, 1))) !important; }
#reader .spread-title { font-size: clamp(calc(2.2rem * var(--pb-heading-scale, 1)), calc(3.2vw * var(--pb-heading-scale, 1)), calc(3rem * var(--pb-heading-scale, 1))) !important; }
#reader .policy-section-header h3 { font-size: calc(1.35rem * var(--pb-heading-scale, 1)) !important; }

/* ---- Heritage history timeline (year spine + text + image) ---- */
.pb-history { position: relative; margin: 26px 0 10px; padding-left: 118px; }
.pb-history::before { content: ""; position: absolute; left: 96px; top: 12px; bottom: 12px; width: 1px; background: var(--gold-hair); }
.pb-h-event { position: relative; display: flex; gap: 28px; align-items: flex-start; padding: 0 0 44px; }
.pb-h-event:last-child { padding-bottom: 12px; }
.pb-h-year { position: absolute; left: -118px; top: 0; width: 96px; text-align: right; padding-right: 26px; }
.pb-h-year-num { font-family: "MO Exceptional", "Times New Roman", serif; font-size: 34px; line-height: 1; color: var(--ink); }
.pb-h-dot { position: absolute; right: -7px; top: 10px; width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 2px solid var(--gold); }
.pb-h-body { flex: 1 1 52%; min-width: 0; }
.pb-h-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); margin: 4px 0 10px; white-space: pre-line; }
.pb-h-text { font-size: var(--pb-font-size, 15px); line-height: var(--pb-line-height, 1.75); color: var(--ink-body); font-style: italic; }
.pb-h-text p { margin: 0 0 8px; }
.pb-h-img { flex: 1 1 44%; margin: 0; max-width: 420px; }
.pb-h-img img { width: 100%; display: block; box-shadow: var(--shadow-card); cursor: zoom-in; }
@media (max-width: 900px) {
  .pb-history { padding-left: 86px; }
  .pb-history::before { left: 66px; }
  .pb-h-year { left: -86px; width: 66px; padding-right: 20px; }
  .pb-h-year-num { font-size: 24px; }
  .pb-h-event { flex-direction: column; gap: 14px; }
  .pb-h-img { max-width: 100%; }
}
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink-body);
  font-family: 'Avenir Next LT Pro', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Typography */
h1, h2, h3, h4 { font-family: 'MO Exceptional', Georgia, serif; font-weight: 500; letter-spacing: -0.005em; color: var(--ink); margin: 0; }
h1 { font-size: clamp(3rem, 6vw, 5.5rem); line-height: 0.98; font-weight: 500; letter-spacing: -0.015em; }
h2 { font-size: clamp(2rem, 3.5vw, 3rem); line-height: 1.05; font-weight: 500; }
h3 { font-family: 'MO Exceptional', Georgia, serif; font-size: 1.6rem; line-height: 1.2; font-weight: 500; }
h4 { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); }
p { margin: 0 0 1em; color: var(--ink-body); }
em, .italic { font-style: italic; }
a { color: var(--gold-deep); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
a:hover { border-bottom-color: var(--gold-deep); }
button { font-family: inherit; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; text-align: left; }

.serif { font-family: 'MO Exceptional', Georgia, serif; }
.serif-italic { font-family: 'Avenir Next LT Pro', 'Helvetica Neue', Arial, sans-serif; font-style: italic; }
.small-caps { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; color: var(--ink-mute); }
.number-anchor { font-family: 'MO Exceptional', Georgia, serif; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.12em; color: var(--gold-deep); font-style: italic; }

/* Multilingual (Phase 1) — topbar language switch + CJK font fallbacks */
.lang-switch { border: 1px solid var(--gold-hair); background: #fff; color: var(--ink-body); border-radius: 999px; padding: 7px 12px; font: 500 11.5px/1 'Avenir Next LT Pro', system-ui, sans-serif; letter-spacing: .04em; margin-right: 12px; outline: none; cursor: pointer; }
.lang-switch:focus { border-color: var(--gold); }
html[lang="zh-CN"] body, html[lang="zh-CN"] button, html[lang="zh-CN"] input, html[lang="zh-CN"] select { font-family: 'Avenir Next LT Pro', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif; }
html[lang="zh-CN"] h1, html[lang="zh-CN"] h2, html[lang="zh-CN"] h3,
html[lang="zh-CN"] .serif, html[lang="zh-CN"] .number-anchor,
html[lang="zh-CN"] .pb-item-head, html[lang="zh-CN"] .pb-heading-text,
html[lang="zh-CN"] .pb-stat-num, html[lang="zh-CN"] .pb-gauge-level,
html[lang="zh-CN"] .pb-pyr-tier .t-name, html[lang="zh-CN"] .pb-chart-big,
html[lang="zh-CN"] .intro-title,
html[lang="zh-CN"] .pb-step-num, html[lang="zh-CN"] .pb-swim-num,
html[lang="zh-CN"] .pb-swim-role-num, html[lang="zh-CN"] .pb-wheel-num { font-family: 'MO Exceptional', 'Songti SC', 'Noto Serif SC', Georgia, serif; }
html[lang="zh-CN"] h4, html[lang="zh-CN"] .small-caps { letter-spacing: .1em; }
/* --- zh-CN global weight & alignment rules -------------------------------
   CJK glyphs carry more visual density per character than Latin, so the
   same nominal weight reads heavier. Global rule: display/heading text one
   step up in weight (600), body text unchanged (400); display sizes one
   step down with slightly looser leading; titles balance-wrap so no single
   orphan character drops onto its own line. */
html[lang="zh-CN"] .cover-title {
  font-weight: 700;
  font-size: clamp(2.3rem, 5.2vw, 4.2rem);
  line-height: 1.18;
  letter-spacing: .05em;
  text-wrap: balance;
  max-width: 14em;
}
html[lang="zh-CN"] .intro-title,
html[lang="zh-CN"] .spread-title,
html[lang="zh-CN"] .opener-title,
html[lang="zh-CN"] .letter-title,
html[lang="zh-CN"] h1, html[lang="zh-CN"] h2, html[lang="zh-CN"] h3,
html[lang="zh-CN"] .pb-heading-text, html[lang="zh-CN"] .pb-item-head { font-weight: 700; }
html[lang="zh-CN"] .spread-title, html[lang="zh-CN"] .opener-title { text-wrap: balance; line-height: 1.25; }
html[lang="zh-CN"] .intro-title { text-wrap: balance; line-height: 1.25; max-width: 16em; margin-left: auto; margin-right: auto; font-size: clamp(1.9rem, 3.6vw, 3rem); }
html[lang="zh-CN"] .menu-card-title { font-weight: 700; letter-spacing: .03em; }
html[lang="zh-CN"] .intro-eyebrow,
html[lang="zh-CN"] .menu-card-eyebrow, html[lang="zh-CN"] .opener-numeral,
html[lang="zh-CN"] .cover-eyebrow { letter-spacing: .3em; }
html[lang="zh-CN"] .menu-fab span, html[lang="zh-CN"] .lang-switch,
html[lang="zh-CN"] #mo-ask-fab { letter-spacing: .12em; }

.cover-lang { position: absolute; top: 22px; right: 26px; z-index: 6; display: flex; gap: 8px; align-items: center; }
.cover-lang-btn { border: 1px solid rgba(255,255,255,.45); background: rgba(13,11,8,.28); color: rgba(255,255,255,.92); border-radius: 999px; padding: 7px 16px; font: 500 11.5px/1 'Avenir Next LT Pro', system-ui, sans-serif; letter-spacing: .06em; cursor: pointer; backdrop-filter: blur(4px); transition: background .2s, border-color .2s; }
.cover-lang-btn:hover { border-color: #fff; }
.cover-lang-btn.on { background: #B59060; border-color: #B59060; color: #fff; }

/* Gold hairline — the ONE ornamental device */
.gold-rule { height: 1px; background: var(--gold-hair); width: 60px; border: none; margin: 24px 0; }
.gold-rule.wide { width: 100%; }
.gold-rule.center { margin-left: auto; margin-right: auto; }

/* Reading progress */
.progress-bar {
  position: fixed; top: 0; left: 0; height: 2px;
  background: var(--gold-hair);
  z-index: 500; width: 0%;
  transition: width 0.15s ease;
}

/* ============================================================
   RUNNING HEADER — the top-of-page identity line
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95);
  backdrop-filter: saturate(180%) blur(10px);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--rule);
  padding: 18px 32px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
}
.brand-left { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--mo-red);
  display: flex; align-items: center; justify-content: center;
  color: #f2e1c2; font-family: 'MO Exceptional', serif; font-style: italic; font-weight: 500;
  font-size: 15px;
}
.brand-mark-text { display: flex; flex-direction: column; line-height: 1; }
.brand-title { font-family: 'MO Exceptional', serif; font-size: 1rem; font-weight: 500; letter-spacing: 0.01em; }
.brand-sub { font-size: 0.62rem; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.18em; margin-top: 3px; }
.brand-fan { display: inline-flex; align-items: center; color: var(--gold-deep); text-decoration: none; }
.brand-fan svg { height: 34px; width: auto; display: block; }
.brand-fan:hover { color: var(--gold); }
.brand-wordmark {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.28em;
  color: var(--ink);
  text-transform: uppercase;
  white-space: nowrap;
  padding-left: 14px;
  margin-left: 4px;
  border-left: 1px solid var(--rule);
}

.running-header {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.32em;
  color: var(--ink);
  text-transform: uppercase;
  text-align: center;
  white-space: nowrap;
}

.brand-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }

/* Search — kept prominent, but styled quieter */
.search {
  position: relative; width: 260px; max-width: 100%;
}
.search input {
  width: 100%;
  padding: 10px 14px 10px 34px;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  transition: border-color 0.15s;
}
.search input:focus { outline: none; border-color: var(--gold-hair); }
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--ink-mute); width: 14px; height: 14px;
}
.search-hint {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  color: var(--ink-fade); font-size: 0.62rem; letter-spacing: 0.06em;
  border: 1px solid var(--rule); padding: 1px 6px; border-radius: 2px;
}
.search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--paper);
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-card);
  max-height: 420px; overflow: auto;
  display: none; z-index: 10;
}
.search-results.on { display: block; }
.search-result {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: background 0.12s;
}
.search-result:last-child { border-bottom: none; }
.search-result:hover, .search-result.sel { background: var(--paper-tint); }
.search-result .sr-title { font-family: 'MO Exceptional', serif; font-size: 0.95rem; color: var(--ink); }
.search-result .sr-crumb { font-size: 0.68rem; color: var(--ink-mute); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

.bookmark-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-mute);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 2px;
  transition: color 0.15s, border-color 0.15s;
}
.bookmark-btn:hover { color: var(--ink); border-color: var(--rule-strong); }
.bookmark-count { color: var(--gold-deep); }

/* ============================================================
   LAYOUT — left rail (chapters) + reading pane
   ============================================================ */
.layout {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  min-height: calc(100vh - 66px);
}

/* Left rail: editorial table of contents (no boxes, no borders) */
.rail {
  position: sticky; top: 66px;
  height: calc(100vh - 66px);
  overflow-y: auto;
  padding: 52px 28px 52px 40px;
  border-right: 1px solid var(--rule);
  background: var(--paper);
}
.rail-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-fade);
  margin-bottom: 6px;
  font-weight: 500;
}
.rail-eyebrow-rule {
  width: 32px; height: 1px; background: var(--gold-hair);
  margin-bottom: 34px;
}
.rail-chapters { list-style: none; padding: 0; margin: 0; }
.rail-chapters > li { margin: 0; }

.rail-link {
  display: grid;
  grid-template-columns: 28px 1fr;
  align-items: baseline;
  column-gap: 14px;
  padding: 14px 0 14px 0;
  color: var(--ink-body);
  font-family: 'MO Exceptional', serif;
  font-size: 1.02rem;
  font-weight: 400;
  line-height: 1.28;
  letter-spacing: 0.002em;
  cursor: pointer;
  transition: color 0.18s ease, transform 0.24s ease;
  width: 100%;
  position: relative;
}
.rail-link .rail-numeral {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 0.82rem;
  color: var(--ink-fade);
  letter-spacing: 0.04em;
  text-align: left;
  transition: color 0.18s ease;
}
.rail-link:hover { color: var(--ink); }
.rail-link:hover .rail-numeral { color: var(--gold-deep); }

/* Active chapter: shift right slightly, gold numeral, tiny gold marker to the left of the numeral */
.rail-link.active {
  color: var(--ink);
  transform: translateX(4px);
}
.rail-link.active .rail-numeral {
  color: var(--gold-deep);
  font-style: italic;
}
.rail-link.active::before {
  content: '';
  position: absolute;
  left: -16px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold-deep);
  opacity: 0.9;
}

/* Hairline divider between chapters — subtle, only between items */
.rail-chapters > li + li .rail-link {
  border-top: 1px solid var(--rule-soft, rgba(0,0,0,0.06));
}

/* Sub-items (A–H under Chapter III) */
.rail-sub {
  list-style: none;
  padding: 4px 0 10px 42px;
  margin: 0;
  display: none;
  position: relative;
}
.rail-sub::before {
  content: '';
  position: absolute;
  left: 30px; top: 6px; bottom: 12px;
  width: 1px;
  background: var(--gold-hair);
  opacity: 0.55;
}
.rail-sub.on { display: block; }
.rail-sub li { margin: 0; }
.rail-sub button {
  display: grid;
  grid-template-columns: 22px 1fr;
  align-items: baseline;
  column-gap: 10px;
  padding: 7px 0;
  color: var(--ink-mute);
  font-family: 'MO Exceptional', serif;
  font-size: 0.86rem;
  font-weight: 400;
  letter-spacing: 0.005em;
  width: 100%;
  transition: color 0.15s ease, transform 0.2s ease;
}
.rail-sub button::before {
  content: attr(data-letter);
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 0.74rem;
  color: var(--ink-fade);
  transition: color 0.15s ease;
}
.rail-sub button:hover { color: var(--ink); transform: translateX(2px); }
.rail-sub button:hover::before { color: var(--gold-deep); }
.rail-sub button.active { color: var(--ink); }
.rail-sub button.active::before { color: var(--gold-deep); }

.rail-footer {
  margin-top: 56px;
  padding-top: 28px;
  position: relative;
}
.rail-footer::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 28px; height: 1px;
  background: var(--gold-hair);
}
.rail-footer h4 {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ink-fade);
  font-weight: 500;
  margin-bottom: 10px;
}
.rail-footer p {
  font-family: 'Avenir Next LT Pro', 'Helvetica Neue', Arial, sans-serif;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  line-height: 1.55;
}

/* ============================================================
   READING PANE
   ============================================================ */
.reader {
  padding: 0;
  max-width: none;
  min-width: 0;
}

.chapter { display: none; animation: chapterIn 0.35s ease; }
/* opacity-only: a lingering transform keyframe (fill:both) would become the
   containing block for position:fixed children (lifecycle dock, etc.) */
@keyframes chapterIn { from { opacity: 0; } to { opacity: 1; } }
.chapter.on { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ============================================================
   SPREADS — the fundamental page unit
   ============================================================ */
.spread {
  padding: 72px 80px;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
}
.spread.tight { padding-top: 48px; padding-bottom: 48px; }
.spread + .spread { border-top: 1px solid var(--rule); }

/* Chapter opener — full-bleed hero image with numeric anchor */
.opener {
  position: relative;
  padding: 0;
  max-width: none;
  overflow: hidden;
}
.opener-hero {
  position: relative;
  height: 82vh;
  min-height: 620px;
  max-height: 900px;
  background-size: cover;
  background-position: center;
  overflow: hidden;
}
.opener-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0.12) 22%, rgba(0,0,0,0.05) 45%, rgba(0,0,0,0.55) 100%);
}
.opener-content {
  position: absolute; inset: 0;
  padding: 56px 80px;
  display: flex; flex-direction: column; justify-content: space-between;
  color: #f7f4ee;
  z-index: 2;
}
.opener-top { display: flex; justify-content: space-between; align-items: flex-start; }
.opener-top-left { display: flex; align-items: center; gap: 22px; }
.opener-back {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: 'Avenir Next LT Pro', 'Helvetica Neue', Arial, sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #f7f4ee;
  background: rgba(20, 16, 12, 0.34);
  border: 1px solid rgba(247, 244, 238, 0.45);
  border-radius: 999px;
  padding: 9px 18px 9px 14px;
  cursor: pointer;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  transition: background 0.25s ease, border-color 0.25s ease;
}
.opener-back:hover { background: rgba(20, 16, 12, 0.6); border-color: rgba(247, 244, 238, 0.8); }
.opener-back svg { width: 15px; height: 15px; display: block; }
.opener-numeral {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 0.9rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #ffffff;
  text-shadow: 0 1px 8px rgba(0,0,0,0.45);
}
.opener-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(247, 244, 238, 0.92);
  text-align: right;
  text-shadow: 0 1px 8px rgba(0,0,0,0.45);
  padding-top: 8px;
}
.opener-bottom {
  max-width: 640px;
}
.opener-title {
  font-family: 'MO Exceptional', serif;
  font-weight: 500;
  font-size: clamp(3rem, 6vw, 5rem);
  line-height: 0.98;
  letter-spacing: -0.015em;
  color: #ffffff;
  margin: 0 0 20px;
}
.opener-sub {
  font-family: 'Avenir Next LT Pro', 'Helvetica Neue', Arial, sans-serif;
  font-style: italic;
  font-size: clamp(1.05rem, 1.4vw, 1.35rem);
  line-height: 1.4;
  color: rgba(247, 244, 238, 0.92);
  max-width: 520px;
}

/* =================================================================
   FULL-SCREEN IMMERSIVE COVER (magazine-style)
   ================================================================= */
.cover-full {
  position: relative;
  width: 100vw;
  min-height: 100vh;
  min-height: 100svh;
  margin-left: calc(50% - 50vw);
  background-size: cover;
  background-position: center 28%;
  display: flex;
  overflow: hidden;
}
.cover-veil {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(13,11,8,0.46) 0%, rgba(13,11,8,0.12) 30%, rgba(13,11,8,0.30) 62%, rgba(13,11,8,0.78) 100%);
  z-index: 1;
}
.cover-inner {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(28px, 4.4vw, 60px) clamp(28px, 6vw, 96px);
  color: #f7f4ee;
}
.cover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cover-wordmark {
  font-family: 'MO Exceptional', serif;
  font-size: clamp(1rem, 1.5vw, 1.5rem);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: #ffffff;
}
.cover-edition {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 0.85rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(247, 244, 238, 0.85);
}
.cover-center {
  max-width: 760px;
  /* Sit the block in the upper-middle so the CTA rises well clear of the
     bottom edge and reads immediately. */
  margin: auto 0;
  padding-bottom: clamp(60px, 12vh, 150px);
}
.cover-eyebrow {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: clamp(0.9rem, 1.2vw, 1.15rem);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(247, 244, 238, 0.9);
  margin-bottom: 22px;
}
.cover-title {
  font-family: 'MO Exceptional', serif;
  font-weight: 500;
  font-size: clamp(3rem, 7vw, 6rem);
  line-height: 0.98;
  letter-spacing: -0.015em;
  color: #ffffff;
  margin: 0 0 24px;
}
.cover-title em {
  font-style: italic;
  font-weight: 400;
}
.cover-sub {
  font-family: 'Avenir Next LT Pro', 'Helvetica Neue', Arial, sans-serif;
  font-style: italic;
  font-size: clamp(1.05rem, 1.5vw, 1.4rem);
  line-height: 1.45;
  color: rgba(247, 244, 238, 0.94);
  max-width: 560px;
  margin: 0 0 28px;
}
.cover-full .cover-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 18px 38px;
  /* Solid gold fill for a clearly visible, primary call-to-action. */
  background: var(--gold);
  border: 1px solid var(--gold);
  color: #1a1408;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.28);
  transition: background 0.35s ease, border-color 0.35s ease, letter-spacing 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
}
.cover-full .cover-cta:hover {
  background: #c9a25f;
  border-color: #c9a25f;
  letter-spacing: 0.3em;
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(0,0,0,0.34);
}
.cover-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(247, 244, 238, 0.7);
}
.cover-scroll { color: rgba(247, 244, 238, 0.85); }

/* =================================================================
   INTRO VIDEO PAGE (welcome interstitial — video only)
   ================================================================= */
.intro-full {
  position: relative;
  width: 100vw;
  min-height: 100vh;
  min-height: 100svh;
  margin-left: calc(50% - 50vw);
  background: var(--paper);
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(32px, 5vw, 72px) clamp(20px, 5vw, 80px);
}
.intro-inner {
  width: 100%;
  max-width: 900px;
  text-align: center;
  color: var(--ink-body);
}
.intro-eyebrow {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: clamp(0.85rem, 1.1vw, 1.05rem);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 16px;
}
.intro-eyebrow::after {
  content: '';
  display: block;
  width: 46px;
  height: 1px;
  background: var(--gold-hair);
  margin: 16px auto 0;
}
.intro-title {
  font-family: 'MO Exceptional', serif;
  font-weight: 500;
  font-size: clamp(1.7rem, 3.6vw, 3rem);
  line-height: 1.12;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0 auto 34px;
  max-width: 820px;
}
.intro-video-wrap {
  position: relative;
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  aspect-ratio: 16 / 9;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(13, 11, 8, 0.18);
  border: 1px solid var(--gold-hair);
  background: #000;
}
.intro-video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
.intro-next {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-top: 32px;
  padding: 15px 32px;
  background: transparent;
  border: 1px solid var(--ink);
  color: var(--ink);
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease, letter-spacing 0.4s ease;
}
.intro-next:hover {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
  letter-spacing: 0.3em;
}
@media (max-width: 700px) {
  .intro-full { padding: 40px 18px; }
}

/* When on the cover, hide the reading chrome so it fills the screen */
body.on-cover .topbar { display: none; }
body.on-cover .rail { display: none; }
body.on-cover .layout { grid-template-columns: 1fr; min-height: 100vh; margin: 0; }
body.on-cover .reader { margin: 0; padding: 0; max-width: none; }
body.on-cover .menu-fab { display: none; }

/* Menu-type pages (root Contents + tile-menu chapters): the left rail
   duplicates the tiles, so it hides; content spans the full width. */
body.on-menu .rail { display: none; }
body.on-menu .layout { grid-template-columns: 1fr; }

@media (max-width: 700px) {
  .cover-inner { padding: 26px 22px 30px; }
  .cover-wordmark { letter-spacing: 0.24em; }
  .cover-foot { font-size: 0.52rem; letter-spacing: 0.28em; }
}

/* Content spread that follows an opener */
.spread-header {
  margin-bottom: 40px;
}
.spread-header .running-mini {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-mute);
  text-align: center;
  margin-bottom: 8px;
}
.spread-header .center-rule {
  width: 40px; height: 1px; background: var(--gold-hair);
  margin: 0 auto 40px;
}
.spread-title {
  font-family: 'MO Exceptional', serif;
  font-weight: 500;
  font-size: clamp(2.2rem, 3.2vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin-bottom: 12px;
}
.spread-title.center { text-align: center; }
.spread-lede {
  font-family: 'Avenir Next LT Pro', 'Helvetica Neue', Arial, sans-serif;
  font-style: italic;
  font-size: 1.25rem;
  color: var(--ink-mute);
  max-width: 640px;
  line-height: 1.5;
}
.spread-lede.center { margin-left: auto; margin-right: auto; text-align: center; }

/* Two-column body */
.cols-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
}
.cols-2 p { font-size: 0.95rem; line-height: 1.75; color: var(--ink-body); }

/* Editorial body (single column, generous measure) */
.editorial-body {
  max-width: 680px;
  margin: 0 auto;
}
.editorial-body p {
  font-size: 1rem;
  line-height: 1.8;
  color: var(--ink-body);
  margin-bottom: 1.4em;
}
.editorial-body p:first-of-type::first-letter,
.editorial-body .drop::first-letter {
  font-family: 'MO Exceptional', serif;
  font-weight: 500;
  font-size: 4.2em;
  float: left;
  line-height: 0.85;
  margin: 0.05em 0.12em -0.05em 0;
  color: var(--ink);
}

/* Pull quote */
.pullquote {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.5rem, 2.2vw, 2rem);
  line-height: 1.3;
  color: var(--ink);
  text-align: center;
  padding: 40px 24px;
  margin: 48px auto;
  max-width: 720px;
  border-top: 1px solid var(--gold-hair);
  border-bottom: 1px solid var(--gold-hair);
  position: relative;
}
.pullquote::before, .pullquote::after {
  content: '';
  position: absolute;
  left: 50%; transform: translateX(-50%);
  width: 6px; height: 6px;
  background: var(--gold-hair);
  border-radius: 50%;
}
.pullquote::before { top: -3.5px; }
.pullquote::after { bottom: -3.5px; }

/* ============================================================
   EDITORIAL FEATURE TREATMENT (Welcome / Introduction)
   Magazine-style visual card row + elevated pull-quote +
   circular line-icon step sequence.
   ============================================================ */
.feature-caption {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold-deep);
  text-align: center;
  margin: 52px 0 6px;
}
.feature-caption::after {
  content: '';
  display: block;
  width: 52px; height: 1px;
  background: var(--gold-hair);
  margin: 16px auto 0;
}

/* Visual card row (image + line icon + label) */
.feature-cards {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 22px;
  margin: 28px 0 8px;
}
.feature-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  border-bottom: none;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.2,0.7,0.2,1);
}
.feature-card:hover { transform: translateY(-4px); border-bottom: none; }
.feature-card-img {
  width: 100%;
  aspect-ratio: 3 / 4;
  background-size: cover;
  background-position: center;
  filter: saturate(0.92) contrast(1.02);
  position: relative;
}
.feature-card-img::after {
  content: '';
  position: absolute; inset: 0;
  border: 1px solid rgba(201,168,121,0.0);
  box-shadow: inset 0 0 0 1px rgba(13,11,8,0.04);
  transition: border-color 0.35s;
}
.feature-card:hover .feature-card-img::after { border-color: var(--gold-hair); }
.feature-card-icon {
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  background: var(--paper);
  margin: -21px auto 0;
  position: relative; z-index: 2;
  color: var(--gold-deep);
  transition: background 0.35s, color 0.35s;
}
.feature-card-icon .line-icon { width: 20px; height: 20px; }
.feature-card:hover .feature-card-icon { background: var(--gold-deep); color: #fff; }
.feature-card-label {
  font-family: 'MO Exceptional', serif;
  font-size: 1.02rem;
  color: var(--ink);
  margin-top: 12px;
  letter-spacing: 0.01em;
}

/* Elevated pull-quote with oversized quotation mark */
.pullquote--feature {
  border: none;
  padding: 8px 24px 12px;
  margin: 44px auto 24px;
  max-width: 780px;
}
.pullquote--feature::before, .pullquote--feature::after { display: none; }
.pullquote--feature .pullquote-mark {
  display: block;
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: normal;
  font-size: 5.5rem;
  line-height: 0.7;
  color: var(--gold-hair);
  height: 46px;
  margin-bottom: 6px;
}
.pullquote--feature .pullquote-text {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: clamp(1.5rem, 2.2vw, 2rem);
  line-height: 1.32;
  color: var(--ink);
  margin: 0;
}
.pullquote--feature .pullquote-flourish {
  display: block;
  width: 54px; height: 1px;
  background: var(--gold-hair);
  margin: 26px auto 0;
  position: relative;
}
.pullquote--feature .pullquote-flourish::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 5px; height: 5px;
  background: var(--gold-hair);
  border-radius: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
}

/* Circular line-icon step sequence */
.step-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
  margin: 30px 0 20px;
  position: relative;
}
.step-row::before {
  content: '';
  position: absolute;
  top: 34px; left: 16.6%; right: 16.6%;
  height: 1px;
  background: repeating-linear-gradient(to right, var(--gold-hair) 0 6px, transparent 6px 12px);
  z-index: 0;
}
.step-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  z-index: 1;
}
.step-icon {
  width: 68px; height: 68px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  background: var(--paper);
  color: var(--gold-deep);
  position: relative;
}
.step-icon .line-icon { width: 30px; height: 30px; }
.step-index {
  position: absolute;
  bottom: -4px; right: -4px;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  background: var(--gold-deep);
  color: #fff;
  border-radius: 50%;
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 0.66rem;
  letter-spacing: 0.02em;
}
.step-title {
  font-family: 'MO Exceptional', serif;
  font-size: 1.05rem;
  color: var(--ink);
  margin: 16px 0 8px;
}
.step-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.9rem;
  line-height: 1.65;
  color: var(--ink-body);
  max-width: 260px;
  margin: 0;
}

@media (max-width: 860px) {
  .feature-cards { grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .step-row { grid-template-columns: 1fr; gap: 28px; }
  .step-row::before { display: none; }
  .step-text { max-width: 380px; }
}
@media (max-width: 480px) {
  .feature-cards { grid-template-columns: 1fr 1fr; }
}

/* ============================================================
   MAGAZINE EDITORIAL SPREAD (Our Purpose)
   Tall image left; body + featured pull-quote right.
   ============================================================ */
.editorial-spread {
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  gap: 56px;
  align-items: stretch;
  margin-top: 8px;
}
.editorial-figure { margin: 0; display: flex; flex-direction: column; }
.editorial-figure-img {
  width: 100%;
  flex: 1 1 auto;
  min-height: 460px;
  background-size: cover;
  background-position: center 22%;
  filter: saturate(0.94) contrast(1.02);
}
.editorial-figure-cap {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--gold-hair);
}
.editorial-col { display: flex; flex-direction: column; justify-content: flex-start; }
.editorial-col .editorial-body p:first-of-type::first-letter,
.editorial-col .editorial-body .drop::first-letter { color: var(--gold-deep); }
.editorial-quote {
  margin: 28px 0 0;
  padding: 26px 0 0;
  border-top: 1px solid var(--gold-hair);
  position: relative;
}
.editorial-quote-mark {
  display: block;
  font-family: 'MO Exceptional', Georgia, serif;
  font-size: 3.4rem;
  line-height: 0.5;
  color: var(--gold-hair);
  height: 30px;
  margin-bottom: 10px;
}
.editorial-quote-text {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.35rem, 1.7vw, 1.7rem);
  line-height: 1.34;
  color: var(--ink);
  margin: 0;
}

/* ============================================================
   THE COLLEAGUE JOURNEY (illustrative map, not navigation)
   ============================================================ */
.journey { margin-top: 68px; }
.journey-head { text-align: center; max-width: 720px; margin: 0 auto; }
.journey-intro {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 1rem;
  line-height: 1.7;
  color: var(--ink-body);
  margin-top: 16px;
}
.journey-path {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin: 44px 0 0;
  position: relative;
}
/* Flowing connector line linking the stages */
.journey-path::before {
  content: '';
  position: absolute;
  top: 122px; left: 10%; right: 10%;
  height: 2px;
  background: repeating-linear-gradient(to right, var(--gold-hair) 0 7px, transparent 7px 15px);
  z-index: 0;
}
.journey-stage {
  position: relative;
  z-index: 1;
