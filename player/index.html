  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.journey-media {
  position: relative;
  width: min(176px, 100%); aspect-ratio: 1 / 1;
  margin-bottom: 22px;
}
.journey-img {
  width: 100%; height: 100%;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  filter: saturate(0.92) contrast(1.02);
  box-shadow: 0 0 0 1px var(--rule), 0 0 0 7px var(--paper), 0 0 0 8px var(--gold-hair);
}
.journey-node {
  position: absolute;
  bottom: -6px; left: 50%;
  transform: translateX(-50%);
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper);
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  color: var(--gold-deep);
}
.journey-node .line-icon { width: 20px; height: 20px; }
.journey-step {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.58rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-fade);
  margin-bottom: 4px;
}
.journey-stage-name {
  font-family: 'MO Exceptional', serif;
  font-size: 1.16rem;
  color: var(--ink);
  margin-bottom: 10px;
}
.journey-stage-name::after {
  content: '';
  display: block;
  width: 24px; height: 1px;
  background: var(--gold-hair);
  margin: 8px auto 0;
}
.journey-role {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.82rem;
  line-height: 1.6;
  color: var(--ink-body);
  margin: 0;
}
.journey-foot {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 1.1rem;
  color: var(--ink);
  text-align: center;
  max-width: 640px;
  margin: 48px auto 0;
  padding-top: 26px;
  border-top: 1px solid var(--gold-hair);
}

/* Reverse spread (text left, image right) & short figure variant */
.editorial-spread--reverse { grid-template-columns: 1.08fr 0.92fr; }
.editorial-figure--short .editorial-figure-img { min-height: 300px; }

/* ============================================================
   CH4 — PRE-OPENING PHILOSOPHY (magazine spread)
   ============================================================ */
.philosophy-spread { margin: 8px 0 8px; }
.philosophy-spread-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--gold-hair);
}
.philosophy-spread .editorial-body p {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 1rem;
  line-height: 1.85;
  color: var(--ink-body);
  margin: 0 0 16px;
}
.philosophy-spread .editorial-body .drop::first-letter {
  font-family: 'MO Exceptional', Georgia, serif;
  float: left;
  font-size: 3.6rem;
  line-height: 0.82;
  padding: 6px 12px 0 0;
  color: var(--gold-deep);
}
/* Short one-line philosophy opener (used instead of a lone drop-cap) */
.philosophy-spread .editorial-body .philosophy-lead-line {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.28rem;
  line-height: 1.45;
  color: var(--gold-deep);
  margin: 0 0 20px;
}
/* Icon-led emphasis box that chunks dense verbatim prose (Design Language #2) */
.prose-emphasis {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  margin: 22px 0;
  padding: 18px 20px;
  background: var(--celadon-tint);
  border-left: 3px solid var(--celadon-deep);
}
.prose-emphasis-icon {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  color: var(--celadon-deep);
  margin-top: 2px;
}
.prose-emphasis-icon .line-icon { width: 22px; height: 22px; }
.prose-emphasis-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.98rem;
  line-height: 1.7;
  color: var(--ink-body);
  margin: 0;
}
/* In-body pull-quote inside a philosophy spread (verbatim emphasised sentence) */
.philosophy-spread .editorial-quote {
  margin: 22px 0;
  padding: 4px 0 4px 22px;
  border-left: 2px solid var(--gold-hair);
  position: relative;
}
.philosophy-spread .editorial-quote-mark {
  position: absolute; left: 14px; top: -10px;
  font-family: 'MO Exceptional', Georgia, serif;
  font-size: 2.4rem; color: var(--gold-hair); line-height: 1;
}
.philosophy-spread .editorial-quote-text {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.32rem;
  line-height: 1.5;
  color: var(--ink);
  margin: 0;
}
/* Give the prose column a touch more room than the card column */
.philosophy-spread .editorial-spread { grid-template-columns: 1.12fr 0.88fr; align-items: start; }
.philosophy-card-col { display: flex; }
/* Framed iconography card (mirrors image-13's bordered right panel) */
.philosophy-card {
  width: 100%;
  border: 1px solid var(--rule-strong);
  border-top: 3px solid var(--gold);
  background: var(--paper-warm);
  padding: 30px 30px 34px;
  display: flex;
  flex-direction: column;
}
.philosophy-card-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold-deep);
  text-align: center;
  padding-bottom: 16px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--gold-hair);
}
.philosophy-card-crest {
  width: 54px; height: 54px;
  margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  color: var(--gold-deep);
}
.philosophy-card-crest svg { width: 26px; height: 26px; }
.philosophy-card-lead {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.06rem;
  line-height: 1.45;
  color: var(--ink);
  text-align: center;
  margin: 0 0 22px;
}
.philosophy-card-rows { display: flex; flex-direction: column; }
.pcard-row {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  padding: 15px 0;
  border-top: 1px solid var(--rule);
}
.pcard-row:first-child { border-top: none; }
.pcard-row-icon {
  flex: 0 0 auto;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  color: var(--celadon-deep);
}
.pcard-row-icon svg { width: 21px; height: 21px; }
.pcard-row-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--ink-body);
}
/* The "role is to ensure" lead + bullets, full width below the spread */
.philosophy-ensure {
  margin-top: 44px;
  padding-top: 32px;
  border-top: 1px solid var(--gold-hair);
  max-width: 900px;
}
.philosophy-ensure-lead {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.2rem;
  color: var(--ink);
  margin: 0 0 18px;
}
.philosophy-ensure-list {
  list-style: none;
  margin: 0; padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 40px;
}
.philosophy-ensure-list li {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.95rem;
  line-height: 1.65;
  color: var(--ink-body);
  padding-left: 24px;
  position: relative;
}
.philosophy-ensure-list li::before {
  content: '';
  position: absolute;
  left: 0; top: 0.62em;
  width: 7px; height: 7px;
  border: 1px solid var(--gold-deep);
  transform: rotate(45deg);
}

/* ============================================================
   CH4 — MILESTONE VERTICAL TIMELINE (Pre-Opening Path)
   ============================================================ */
.mstone { margin: 44px 0 8px; }
.mstone-grid {
  display: grid;
  grid-template-columns: 0.82fr 1.18fr;
  gap: 56px;
  align-items: start;
}
.mstone-left { position: sticky; top: 96px; }
.mstone-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 12px;
}
.mstone-heading {
  font-family: 'MO Exceptional', Georgia, serif;
  font-size: 1.8rem;
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 18px;
  line-height: 1.15;
}
.mstone-lead p {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.95rem;
  line-height: 1.8;
  color: var(--ink-body);
  margin: 0 0 14px;
}
/* image-7-style callout band */
.mstone-callout {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-top: 22px;
  padding: 22px 24px;
  background: var(--paper-tint);
  border-left: 2px solid var(--gold);
}
.mstone-callout-icon {
  flex: 0 0 auto;
  color: var(--gold-deep);
}
.mstone-callout-icon .line-icon { width: 26px; height: 26px; }
.mstone-callout-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.92rem;
  line-height: 1.7;
  color: var(--ink-body);
  margin: 0;
}
.mstone-callout-text em {
  font-style: italic;
  font-weight: 600;
  color: var(--gold-deep);
  letter-spacing: 0.01em;
}
/* vertical timeline */
.mstone-timeline {
  list-style: none;
  margin: 0; padding: 0;
  position: relative;
}
.mstone-timeline::before {
  content: '';
  position: absolute;
  left: 21px; top: 8px; bottom: 8px;
  width: 1px;
  background: var(--gold-hair);
}
.mstone-step {
  position: relative;
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 22px;
  padding-bottom: 34px;
}
.mstone-step:last-child { padding-bottom: 0; }
.mstone-marker {
  position: relative;
  z-index: 1;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper);
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  color: var(--gold-deep);
}
.mstone-marker .line-icon { width: 22px; height: 22px; }
.mstone-body { padding-top: 4px; }
.mstone-step-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 1.12rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 10px;
  line-height: 1.2;
}
.mstone-step-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.92rem;
  line-height: 1.72;
  color: var(--ink-body);
  margin: 0;
}

/* ============================================================
   CH5 — P&C AUDIT INTRO + FRAMEWORK ORBIT DIAGRAM
   ============================================================ */
.audit-intro-lede p {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.5rem;
  line-height: 1.5;
  color: var(--ink);
  max-width: 780px;
  margin: 0 0 8px;
}
.audit-intro-body p {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 1rem;
  line-height: 1.85;
  color: var(--ink-body);
  max-width: 780px;
  margin: 0 0 16px;
}

/* Framework orbit diagram — sits in the RIGHT column of the audit spread,
   mirroring the image column of the standard magazine spread. */
.audit-visual-col { justify-content: stretch; }
.orbit {
  height: 100%;
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 34px 36px;
  background: linear-gradient(160deg, var(--paper-warm) 0%, var(--celadon-tint) 220%);
  border: 1px solid var(--gold-hair);
  border-top: 3px solid var(--celadon);
}
.orbit-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold-deep);
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--gold-hair);
}
.orbit-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.orbit-stage svg { max-width: 320px; width: 100%; height: auto; }
.orbit-stage svg.audit-orbit-svg { max-width: 420px; }
.orbit-caption {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  text-align: center;
  max-width: 300px;
  margin-top: 14px;
  line-height: 1.5;
}
.orbit-benefits {
  margin-top: 26px;
  padding-top: 22px;
  border-top: 1px solid var(--gold-hair);
}
.orbit-benefits-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute);
  text-align: center;
  margin-bottom: 10px;
}
.orbit-benefit {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--gold-hair);
}
.orbit-benefits-eyebrow + .orbit-benefit { border-top: none; }
.orbit-benefit:last-child { border-bottom: 1px solid var(--gold-hair); }
.orbit-benefit-icon {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--celadon-hair);
  border-radius: 50%;
  color: var(--celadon-deep);
  background: var(--paper);
}
.orbit-benefit-icon .line-icon { width: 22px; height: 22px; }
.orbit-benefit-body { padding-top: 2px; }
.orbit-benefit-label {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--celadon-deep);
  margin-bottom: 6px;
}
.orbit-benefit-text {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.02rem;
  line-height: 1.34;
  color: var(--ink);
  margin: 0;
  text-transform: capitalize;
}

/* Strategic Vision globe — celadon sphere, gold pins + gold goal callouts,
   the mirror-image accent mix of the audit orbit (gold core / celadon ring). */
.globe { border-top: 3px solid var(--gold); }
.globe .orbit-eyebrow { color: var(--celadon-deep); border-bottom-color: var(--celadon-hair); }

/* Strategic Vision globe (static) — large sphere, criss-crossing gold lines
   and hotel-icon destinations. No animation. */
.globe .orbit-stage svg.globe-svg { max-width: 420px; }
.globe .orbit-caption { max-width: 380px; }
.globe-goal {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--gold-hair);
}
.orbit-benefits-eyebrow + .globe-goal { border-top: none; }
.globe-goal:last-child { border-bottom: 1px solid var(--gold-hair); }
.globe-goal-icon {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  color: var(--gold-deep);
  background: var(--paper);
}
.globe-goal-icon .line-icon { width: 22px; height: 22px; }
.globe-goal-body { padding-top: 2px; }
.globe-goal-label {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 6px;
}
.globe-goal-text {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.02rem;
  line-height: 1.34;
  color: var(--ink);
  margin: 0;
}

/* ---- Vision / Mission / Values — interactive click-to-reveal ---- */
.beliefs-intro {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.9rem;
  color: var(--ink-mute);
  margin: 0 0 22px;
}
.beliefs-tabs {
  display: flex;
  gap: 40px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 40px;
}
.beliefs-tab {
  appearance: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 0 16px;
  margin-bottom: -1px;
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.5rem;
  font-weight: 500;
  color: var(--ink-fade);
  border-bottom: 2px solid transparent;
  transition: color 0.25s, border-color 0.25s;
}
.beliefs-tab:hover { color: var(--gold-deep); }
.beliefs-tab.is-active {
  color: var(--ink);
  border-bottom-color: var(--gold);
}
.beliefs-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  align-items: start;
  animation: beliefsFade 0.45s ease;
}
.beliefs-panel[hidden] { display: none; }
@keyframes beliefsFade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.beliefs-statement-col {
  background: linear-gradient(160deg, var(--celadon-tint) 0%, var(--paper-warm) 130%);
  border-left: 3px solid var(--celadon);
  padding: 40px 38px;
}
.beliefs-statement-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--celadon-deep);
  margin-bottom: 22px;
}
.beliefs-statement {
  font-family: 'MO Exceptional', Georgia, serif;
  font-size: 2.05rem;
  line-height: 1.2;
  font-weight: 500;
  color: var(--ink);
}
.beliefs-statement em {
  font-style: italic;
  color: var(--gold-deep);
}
.beliefs-items-col { padding-top: 4px; }
.beliefs-item {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  padding: 18px 0;
  border-top: 1px solid var(--rule);
}
.beliefs-item:first-child { border-top: none; padding-top: 0; }
.beliefs-item-icon {
  flex: 0 0 auto;
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--celadon-hair);
  border-radius: 50%;
  color: var(--celadon-deep);
  background: var(--paper);
}
.beliefs-item-icon .line-icon { width: 22px; height: 22px; }
.beliefs-item-body { padding-top: 3px; }
.beliefs-item-label {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.66rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 6px;
}
.beliefs-item-text {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.08rem;
  line-height: 1.35;
  color: var(--ink);
  margin: 0;
}
.beliefs-values-note { margin-top: 44px; }

/* Section lead-in (italic intro under an eyebrow) */
.section-lead {
  max-width: 680px;
  margin: 4px auto 0;
  text-align: center;
  color: var(--ink-body);
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-style: italic;
  font-size: 1.12rem;
  line-height: 1.6;
}

/* ============================================================
   BUBBLE LIST — circular image + serif number + heading + caption
   (key points expressed as elegant bubbles)
   ============================================================ */
.bubble-list {
  display: flex;
  flex-direction: column;
  gap: 28px;
  margin: 30px 0 4px;
}
.bubble-item {
  display: flex;
  align-items: center;
  gap: 22px;
}
.bubble-media {
  position: relative;
  flex: 0 0 auto;
  width: 96px; height: 96px;
}
.bubble-img {
  width: 96px; height: 96px;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  filter: saturate(0.92) contrast(1.02);
  box-shadow: 0 0 0 1px var(--rule), 0 0 0 5px var(--paper), 0 0 0 6px var(--gold-hair);
}
.bubble-num {
  position: absolute;
  top: -6px; right: -6px;
  font-family: 'MO Exceptional', Georgia, serif;
  font-size: 1.7rem;
  line-height: 1;
  color: var(--gold-deep);
  background: var(--paper);
  padding: 2px 6px;
}
.bubble-body { flex: 1 1 auto; }
.bubble-title {
  font-family: 'MO Exceptional', serif;
  font-size: 1.24rem;
  color: var(--ink);
  margin: 0 0 6px;
  letter-spacing: 0.01em;
}
.bubble-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.92rem;
  line-height: 1.6;
  color: var(--ink-body);
  margin: 0;
}

/* Refined symbol legend — carded, centered grid */
.symbol-legend--refined {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
  margin-top: 30px;
}
.symbol-legend--refined .symbol-item {
  background: var(--paper-warm);
  border: 1px solid var(--rule);
  border-top: 2px solid var(--gold-hair);
  padding: 26px 26px 24px;
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.symbol-legend--refined .sym {
  flex: 0 0 auto;
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  color: var(--gold-deep);
  background: var(--paper);
}
.symbol-legend--refined .sym .line-icon { width: 24px; height: 24px; }
.symbol-legend--refined h4 {
  font-family: 'MO Exceptional', serif;
  font-size: 1.12rem;
  color: var(--ink);
  margin: 2px 0 6px;
}
.symbol-legend--refined p {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--ink-body);
  margin: 0;
}

@media (max-width: 900px) {
  .editorial-spread { grid-template-columns: 1fr; gap: 32px; }
  .philosophy-spread .editorial-spread { grid-template-columns: 1fr; gap: 32px; }
  .editorial-spread--reverse { grid-template-columns: 1fr; }
  .editorial-spread--reverse .editorial-figure { order: -1; }
  .editorial-figure-img { min-height: 340px; }
  .editorial-figure--short .editorial-figure-img { min-height: 260px; }
  .journey-path { grid-template-columns: repeat(2, 1fr); gap: 40px 26px; }
  .journey-path::before { display: none; }
  .symbol-legend--refined { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .journey-path { grid-template-columns: 1fr; }
  .journey-media { width: 172px; height: auto; }
  .bubble-item { gap: 16px; }
  .bubble-media, .bubble-img { width: 80px; height: 80px; }
}

/* ============================================================
   CPO LETTER SPREAD (Chapter I)
   ============================================================ */
.cpo-spread {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 56px;
  align-items: start;
}
.cpo-portrait-wrap { position: relative; }
.cpo-portrait {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  display: block;
  background: var(--paper-tint);
}
.cpo-caption {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--gold-hair);
}
.cpo-caption .cpo-name { font-family: 'MO Exceptional', serif; font-size: 1.1rem; color: var(--ink); font-weight: 500; }
.cpo-caption .cpo-role { font-family: 'Avenir Next LT Pro', sans-serif; font-style: italic; font-size: 0.95rem; color: var(--ink-mute); margin-top: 2px; }
.cpo-letter { padding-top: 8px; }
.cpo-letter .letter-greeting { font-family: 'Avenir Next LT Pro', sans-serif; font-style: italic; font-size: 1.4rem; color: var(--ink); margin-bottom: 20px; }
.cpo-letter .letter-body p { font-size: 1rem; line-height: 1.8; color: var(--ink-body); margin-bottom: 1.1em; }
.cpo-letter .letter-body strong { color: var(--ink); font-weight: 600; }
.cpo-letter .letter-close { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--rule); }
.cpo-letter .letter-signature { font-family: 'Avenir Next LT Pro', sans-serif; font-style: italic; font-size: 1.15rem; color: var(--ink); }

/* ============================================================
   PHOTO GRID (About MO, Global Presence, etc.)
   ============================================================ */
.photo-grid {
  display: grid;
  gap: 4px;
}
.photo-grid.two { grid-template-columns: 1fr 1fr; }
.photo-grid.three { grid-template-columns: repeat(3, 1fr); }
.photo-grid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; background: var(--paper-tint); }
.photo-grid.landscape img { aspect-ratio: 4/3; }

/* Mosaic — one large + tiled small */
.mosaic {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 6px;
}
.mosaic-main { aspect-ratio: 4/5; overflow: hidden; }
.mosaic-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mosaic-side { display: grid; grid-template-rows: 1fr 1fr; gap: 6px; }
.mosaic-side img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Full-bleed image inside a spread */
.bleed-img {
  width: 100%;
  aspect-ratio: 16/7;
  object-fit: cover;
  display: block;
  background: var(--paper-tint);
  margin: 0;
}

/* ============================================================
   LEADERS GRID (Senior Management, VP)
   ============================================================ */
.section-eyebrow {
  display: flex; align-items: center; gap: 16px;
  margin: 56px 0 32px;
}
.section-eyebrow .num {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 1.6rem;
  color: var(--gold-deep);
  min-width: 40px;
}
.section-eyebrow .txt {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 500;
}
.section-eyebrow .rule { flex: 1; height: 1px; background: var(--gold-hair); }
.section-eyebrow .eyebrow-icon {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  color: var(--gold-deep);
}
.section-eyebrow .eyebrow-icon .line-icon { width: 17px; height: 17px; }

.leaders-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px 16px;
  margin-top: 32px;
}
.leader { text-align: left; }
.leader-photo {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  background: var(--paper-tint);
  display: block;
  margin-bottom: 10px;
  filter: grayscale(0.15) contrast(1.02);
}
.leader-name { font-family: 'MO Exceptional', serif; font-size: 0.95rem; font-weight: 500; color: var(--ink); line-height: 1.2; margin-bottom: 4px; }
.leader-role { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); line-height: 1.4; }
.leaders-grid--pc { grid-template-columns: repeat(4, 1fr); max-width: 860px; margin-left: auto; margin-right: auto; gap: 8px 24px; }

.leader-footnote {
  margin-top: 24px;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-style: italic;
  font-size: 0.95rem;
  color: var(--ink-mute);
  text-align: center;
}

/* Heritage figure (reception colleagues) */
.heritage-figure { margin: 0 0 28px; }
.heritage-figure-img {
  width: 100%;
  aspect-ratio: 16 / 11;
  background-size: cover;
  background-position: center 42%;
  background-repeat: no-repeat;
  background-color: var(--paper-tint);
}
.heritage-figure-cap {
  margin-top: 10px;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* Editorial image band — chapter visual rhythm (Chapters III–VI) */
.editorial-band { margin: 52px 0 56px; }
.editorial-band-img {
  width: 100%;
  aspect-ratio: 21 / 9;
  background-size: cover;
  background-position: center 45%;
  background-repeat: no-repeat;
  background-color: var(--paper-tint);
  filter: saturate(0.94) contrast(1.02);
  position: relative;
}
.editorial-band-img::after {
  content: '';
  position: absolute; inset: 0;
  box-shadow: inset 0 0 0 1px rgba(13,11,8,0.05);
}
.editorial-band-cap {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-top: 12px;
}
.editorial-band-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-deep);
  white-space: nowrap;
  flex: 0 0 auto;
}
.editorial-band-eyebrow::after {
  content: '';
  display: inline-block;
  width: 26px; height: 1px;
  background: var(--gold-hair);
  vertical-align: middle;
  margin-left: 14px;
}
.editorial-band-text {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 0.98rem;
  color: var(--ink-mute);
  line-height: 1.5;
}

/* Full-width (edge-to-edge) atmospheric band. Image spans the chapter width;
   the caption row is re-inset to align with the reading column. */
.editorial-band--full { margin: 0 0 8px; }
.editorial-band--full .editorial-band-img { aspect-ratio: 21 / 8; }
.editorial-band--full .editorial-band-cap {
  max-width: 1200px;
  margin: 12px auto 0;
  padding: 0 80px;
}

/* Board Leadership */
.board-block { margin-top: 48px; }
.board-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 36px;
}
.board-heading .board-rule {
  flex: 1;
  max-width: 140px;
  height: 1px;
  background: var(--gold-hair);
}
.board-title {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-deep);
  white-space: nowrap;
}
.board-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
  max-width: 720px;
  margin: 0 auto;
}
.board-card { text-align: center; }
.board-role {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 14px;
}
.board-photo {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: center 22%;
  display: block;
  border: 1px solid var(--rule);
  filter: grayscale(0.12) contrast(1.02);
  margin-bottom: 14px;
}
.board-name {
  font-family: 'MO Exceptional', serif;
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--ink);
}
@media (max-width: 560px) {
  .board-grid { grid-template-columns: 1fr; gap: 32px; max-width: 300px; }
  .board-heading .board-rule { max-width: 60px; }
}

/* VP hierarchy */
.vp-hierarchy {
  margin-top: 24px;
  padding: 40px 32px 32px;
  background: var(--paper-warm);
  position: relative;
}
.vp-hierarchy::before {
  content: '';
  position: absolute; top: 0; left: 40px; right: 40px;
  height: 1px; background: var(--gold-hair);
}
.vp-top { display: flex; justify-content: center; margin-bottom: 56px; position: relative; }
.vp-top::after {
  content: '';
  position: absolute;
  top: calc(100% + 8px);
  left: 50%; transform: translateX(-50%);
  width: 1px; height: 40px;
  background: var(--gold-hair);
}
.vp-branches {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  position: relative;
}
.vp-branches::before {
  content: '';
  position: absolute;
  top: -8px; left: 16.66%;
  width: 66.66%; height: 1px;
  background: var(--gold-hair);
}
.vp-branch { position: relative; padding-top: 40px; }
.vp-branch::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 1px; height: 40px;
  background: var(--gold-hair);
}
.vp-card {
  text-align: center;
  padding: 16px 12px 20px;
  background: var(--paper);
  border: 1px solid var(--rule);
}
.vp-card--top {
  border: 1px solid var(--gold-hair);
  padding: 20px 20px 24px;
  max-width: 260px;
}
.vp-role-eyebrow { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 12px; }
.vp-photo {
  width: 96px; height: 96px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 12px;
  display: block;
  filter: grayscale(0.15);
}
.vp-card--top .vp-photo { width: 120px; height: 120px; }
.vp-name { font-family: 'MO Exceptional', serif; font-size: 1rem; color: var(--ink); font-weight: 500; }

/* ============================================================
   THE COLLEAGUE LIFECYCLE WHEEL — the main anchor
   ============================================================ */
.wheel-spread {
  padding: 72px 32px 96px;
  text-align: center;
  max-width: 1200px;
  margin: 0 auto;
}
.wheel-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  align-items: center;
  gap: 48px;
  max-width: 1040px;
  margin: 40px auto 0;
  text-align: left;
}
.wheel-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  aspect-ratio: 1/1;
}
.wheel-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wheel-slice { cursor: pointer; transition: opacity 0.18s, transform 0.18s, filter 0.18s; transform-origin: center; transform-box: fill-box; }
.wheel-slice:hover { opacity: 0.92; transform: scale(1.03); }
.wheel-slice.is-active { opacity: 1; transform: scale(1.045); filter: drop-shadow(0 6px 12px rgba(143,109,63,0.35)); }
/* Kill the default rectangular browser outline on click / tap focus (was showing a stray black box above the top slice). Keep an elegant gold ring for keyboard users only. */
.wheel-slice:focus { outline: none; }
.wheel-slice:focus-visible { outline: none; stroke: var(--gold-deep); stroke-width: 3; opacity: 1; }

/* Wheel caption panel — reveals each stage's focus on hover / focus / tap */
.wheel-caption {
  position: relative;
  min-height: 240px;
  display: flex;
  align-items: center;
}
.wheel-caption-inner {
  border-left: 2px solid var(--gold-hair);
  padding: 6px 0 6px 28px;
  animation: wheelCapFade 0.35s ease both;
}
@keyframes wheelCapFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wheel-caption--rest { border-left-color: var(--rule); }
.wheel-caption-icon { color: var(--gold-deep); margin-bottom: 16px; }
.wheel-caption-icon .line-icon { width: 34px; height: 34px; }
.wheel-caption-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 12px;
}
.wheel-caption-title {
  font-family: 'MO Exceptional', serif;
  font-size: 1.7rem;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.15;
  margin: 0 0 14px;
}
.wheel-caption-desc {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.92rem;
  color: var(--ink-body);
  line-height: 1.6;
  margin: 0;
  max-width: 34ch;
}
.wheel-caption-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-deep);
  transition: gap 0.2s, color 0.2s;
}
.wheel-caption-cta:hover { gap: 14px; color: var(--ink); }
.wheel-caption-cta svg { width: 18px; height: 18px; }
.wheel-label {
  font-family: 'MO Exceptional', serif;
  font-size: 13px;
  fill: var(--ink);
  pointer-events: none;
  font-weight: 500;
}
.wheel-letter {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 11px;
  fill: var(--ink-mute);
  pointer-events: none;
}
.wheel-center-text {
  fill: var(--ink);
  font-family: 'Avenir Next LT Pro', sans-serif;
}
.wheel-legend {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px 32px;
  max-width: 820px;
  margin: 40px auto 0;
  text-align: left;
}
.wheel-legend-item {
  padding: 20px 0;
  border-top: 1px solid var(--rule);
  cursor: pointer;
  transition: color 0.15s;
}
.wheel-legend-item:hover { color: var(--gold-deep); }
.line-icon { width: 26px; height: 26px; display: block; }
.wheel-legend-item .icon { color: var(--gold-deep); margin-bottom: 12px; opacity: 0.9; transition: opacity 0.15s; }
.wheel-legend-item:hover .icon { opacity: 1; }
.eyebrow-icon { display: inline-block; vertical-align: middle; margin-right: 10px; color: var(--gold-hair); }
.eyebrow-icon .line-icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; }
.opener-icon { display: inline-block; vertical-align: middle; margin-right: 12px; color: rgba(247,244,238,0.9); }
.opener-icon .line-icon { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }
.wheel-legend-item .num { font-family: 'MO Exceptional', serif; font-style: italic; font-size: 0.85rem; color: var(--gold-deep); letter-spacing: 0.14em; margin-bottom: 4px; }
.wheel-legend-item .title { font-family: 'MO Exceptional', serif; font-size: 1.05rem; color: var(--ink); font-weight: 500; }
.wheel-legend-item .desc {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.75rem;
  color: var(--ink-mute);
  line-height: 1.5;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  margin-top: 0;
  transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
}
@media (hover: hover) {
  .wheel-legend-item:hover .desc { max-height: 120px; opacity: 1; margin-top: 6px; }
}
.wheel-legend-item.open .desc { max-height: 120px; opacity: 1; margin-top: 6px; }
.wheel-legend-item.open .title { color: var(--gold-deep); }

/* ============================================================
   SUB-CHAPTER LAYOUT (within Chapter III)
   ============================================================ */
.sub-hero {
  position: relative;
  height: 480px;
  overflow: hidden;
  margin-bottom: 64px;
}
.sub-hero-img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.sub-hero-caption {
  position: absolute; left: 40px; bottom: 40px; right: 40px;
  color: #fff;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
}
.sub-hero-caption .letter {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 4rem;
  line-height: 1;
  color: rgba(255,255,255,0.9);
}
.sub-hero-caption .title-block { flex: 1; }
.sub-hero-caption .eyebrow { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.65rem; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 10px; }
.sub-hero-caption h2 { color: #fff; font-family: 'MO Exceptional', serif; font-size: 3rem; font-weight: 500; line-height: 1; letter-spacing: -0.015em; margin-bottom: 12px; }
.sub-hero-caption .sub-lede { font-family: 'Avenir Next LT Pro', sans-serif; font-style: italic; font-size: 1.15rem; color: rgba(255,255,255,0.92); max-width: 560px; }

.philosophy-block {
  max-width: 720px; margin: 0 auto 64px; text-align: center;
}
.philosophy-block .eyebrow { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.65rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 20px; }
.philosophy-block .rule { width: 30px; height: 1px; background: var(--gold-hair); margin: 0 auto 24px; }
.philosophy-block p { font-family: 'Avenir Next LT Pro', sans-serif; font-style: italic; font-size: 1.35rem; color: var(--ink); line-height: 1.5; }

/* Policy sections within a sub-chapter */
.policy-section { margin-bottom: 56px; }
.policy-section-header {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--gold-hair);
}
.policy-section-icon {
  flex: 0 0 auto;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-hair);
  border-radius: 50%;
  color: var(--gold-deep);
  background: var(--paper);
  transition: background 0.35s cubic-bezier(0.2,0.7,0.2,1), color 0.35s;
}
.policy-section-icon .line-icon { width: 20px; height: 20px; }
.policy-section:hover .policy-section-icon { background: var(--gold-deep); color: var(--paper); }
.policy-section-header .num {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 1.4rem;
  color: var(--gold-deep);
  min-width: 30px;
}
.policy-section-header h3 {
  font-family: 'MO Exceptional', serif;
  font-size: 1.35rem;
  color: var(--ink);
  font-weight: 500;
  flex: 1;
  margin: 0;
}

/* Policy chips — the actual resource list */
.policy-list { display: grid; gap: 2px; }
/* Group heading row that titles a set of resources (not itself a resource) */
.policy-group-heading {
  padding: 6px 4px 20px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--gold-hair);
}
.policy-group-heading + .policy-item { border-top: none; }
.policy-group-heading-top { display: flex; align-items: center; gap: 14px; }
.policy-group-icon {
  flex: 0 0 auto;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  color: var(--gold-deep);
}
.policy-group-icon .line-icon { width: 20px; height: 20px; }
.policy-group-title {
  font-family: 'MO Exceptional', Georgia, serif;
  font-size: 1.32rem;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--ink);
  margin: 0;
}
.policy-group-desc {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--ink-body);
  margin: 12px 0 0;
  max-width: 62ch;
}
.policy-item {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 20px;
  align-items: center;
  padding: 14px 4px;
  border-bottom: 1px solid var(--rule);
  transition: background 0.12s;
}
.policy-item:hover { background: var(--paper-warm); }
.policy-symbol {
  line-height: 1;
  text-align: center;
  color: var(--gold-deep);
  opacity: 0.85;
}
.policy-symbol .line-icon { width: 18px; height: 18px; margin: 0 auto; }
.policy-name {
  font-family: 'MO Exceptional', serif;
  font-size: 0.98rem;
  color: var(--ink);
  font-weight: 500;
  line-height: 1.35;
}
.policy-name-sub {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  color: var(--ink-mute);
  margin-top: 3px;
}
.policy-kind {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
}

/* ============================================================
   SUB-CHAPTER INTRO, PHILOSOPHY (multi-para), SECTION BLURBS
   ============================================================ */
/* Sub-chapter opening tagline (verbatim from source) */
.sub-tagline {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.5rem;
  line-height: 1.45;
  color: var(--ink);
  text-align: center;
  max-width: 760px;
  margin: 0 auto 40px;
}
/* Sub-chapter intro body paragraphs */
#reader {
  --pb-font-size: 17px;
  --pb-line-height: 1.8;
  --pb-text-align: left;
}
.sub-intro {
  max-width: 720px;
  margin: 0 0 56px;
}
.sub-intro p {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: var(--pb-font-size, 1rem);
  line-height: var(--pb-line-height, 1.8);
  text-align: var(--pb-text-align, left);
  color: var(--ink-body);
  margin: 0 0 1.1em;
}
.sub-intro-lead {
  font-weight: 600;
  color: var(--ink) !important;
  margin-bottom: 0.6em !important;
}
.sub-intro-list {
  list-style: none;
  padding: 0;
  margin: 0 0 1.4em;
}
.sub-intro-list li {
  position: relative;
  padding: 8px 0 8px 26px;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: var(--pb-font-size, 0.95rem);
  line-height: var(--pb-line-height, 1.65);
  text-align: var(--pb-text-align, left);
  color: var(--ink-body);
  border-bottom: 1px solid var(--rule);
}
.sub-intro-list li::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 17px;
  width: 7px;
  height: 7px;
  border: 1px solid var(--gold-deep);
  transform: rotate(45deg);
}

/* Philosophy block now supports multiple paragraphs + bullets */
.philosophy-block { text-align: center; }
.philosophy-block p:first-of-type {
  font-size: 1.35rem;
}
.philosophy-block .sub-intro-lead,
.philosophy-block .sub-intro-list {
  text-align: left;
  max-width: 620px;
  margin-left: auto;
  margin-right: auto;
}
.philosophy-block .sub-intro-lead {
  font-style: normal !important;
  font-size: 0.72rem !important;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute) !important;
  margin-top: 32px !important;
}
.philosophy-block .sub-intro-list li {
  font-style: normal;
  font-size: 0.95rem;
  color: var(--ink-body);
}

.policy-text-item { font-size: var(--pb-font-size, 17px); text-align: var(--pb-text-align, left); }

/* Hotspots on images */
.hotspot-wrap img { display: block; }
.hotspot-dot {
  position: absolute; transform: translate(-50%, -50%);
  width: 26px; height: 26px; border-radius: 50%;
  background: #B59060; color: #fff; border: 2px solid #fff;
  font: 600 12px/1 system-ui; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 0 0 3px rgba(181,144,96,.35), 0 2px 8px rgba(13,11,8,.3);
  transition: transform .15s ease;
}
.hotspot-dot:hover, .hotspot-dot.on { transform: translate(-50%, -50%) scale(1.15); background: #8f6d3f; }
.hotspot-pop {
  position: absolute; transform: translate(-50%, 8px);
  width: 240px; max-width: 70vw; z-index: 30;
  background: #FAF9F6; border: 1px solid #C9A879; border-radius: 6px;
  padding: 12px 14px; box-shadow: 0 10px 30px rgba(13,11,8,.22);
  display: none; font-size: 13px; line-height: 1.55; color: #4a443f;
}
.hotspot-pop.show { display: block; }
.hotspot-pop-title { font-weight: 600; color: #0d0b08; margin-bottom: 4px; font-size: 13px; }
.hotspot-tools { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.hotspot-toggle {
  border: 1px solid #C9A879; background: none; color: #8f6d3f; border-radius: 20px;
  padding: 6px 14px; font: 600 11px system-ui; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}
.hotspot-toggle:hover { background: #B59060; color: #fff; }
.hotspot-cap { font-size: 12px; color: var(--ink-mute); }

/* Inline images inside prose (author markers) */
.inline-img { margin: 18px 0; }
.inline-img img { width: 100%; display: block; }
.inline-img video, .inline-vid video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #0d0b08; border-radius: 3px; }
.inline-img--left { float: left; width: 44%; margin: 6px 26px 14px 0; }
.inline-img--right { float: right; width: 44%; margin: 6px 0 14px 26px; }
.policy-section-blurb::after, .sub-intro::after, .editorial-body::after { content: ''; display: block; clear: both; }
@media (max-width: 640px) { .inline-img--left, .inline-img--right { float: none; width: 100%; margin: 14px 0; } }
.policy-tab-panel p { font-size: var(--pb-font-size, 14px) !important; text-align: var(--pb-text-align, left) !important; }

/* Section (numbered heading) intro blurb + transition */
.policy-section-blurb {
  max-width: 720px;
  margin: -8px 0 28px;
}
.policy-section-blurb p {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: var(--pb-font-size, 0.98rem);
  line-height: var(--pb-line-height, 1.75);
  text-align: var(--pb-text-align, left);
  color: var(--ink-body);
  margin: 0 0 0.9em;
}
.policy-section-transition {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--ink-mute);
  max-width: 700px;
  margin: 28px auto 0;
  padding-top: 22px;
  border-top: 1px solid var(--gold-hair);
  text-align: center;
}

/* Editorial pull-quote for the verbatim section “transition” sentence */
.section-quote {
  max-width: 760px;
  margin: 40px auto 8px;
  padding: 4px 24px 0;
  text-align: center;
}
.section-quote-mark {
  display: block;
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: normal;
  font-size: 5rem;
  line-height: 0.6;
  color: var(--gold-hair);
  height: 42px;
}
.section-quote-text {
  font-family: 'MO Exceptional', Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.35rem, 1.9vw, 1.7rem);
  line-height: 1.4;
  color: var(--ink);
  margin: 0;
  quotes: none;
}
.section-quote-text::before, .section-quote-text::after { content: none; }
.section-quote-flourish {
  display: block;
  width: 54px; height: 1px;
  background: var(--gold-hair);
  margin: 24px auto 0;
  position: relative;
}
.section-quote-flourish::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gold-hair);
  transform: translate(-50%, -50%);
}

/* In-body feature pull-quote (verbatim key sentence, framed within a section) */
.section-quote--feature {
  margin: 34px auto 30px;
  max-width: 720px;
}
.section-quote--feature .section-quote-text {
  font-size: clamp(1.25rem, 1.7vw, 1.55rem);
}

/* Supporting body text that follows the shortened pull-quote (NOT quoted) */
.policy-section-blurb--after {
  max-width: 720px;
  margin: 24px auto 0;
}
.policy-section-blurb--before {
  max-width: 720px;
  margin: 28px 0 4px;
}

/* ============================================================
   HIGHLIGHT ICON-CARD GRID (verbatim key phrases, magazine style)
   ============================================================ */
.hl-block {
  margin: 30px 0 34px;
}
.hl-block-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-deep);
  text-align: center;
  margin-bottom: 22px;
}
.hl-block-eyebrow::after {
  content: '';
  display: block;
  width: 40px; height: 1px;
  background: var(--gold-hair);
  margin: 12px auto 0;
}
.hl-grid {
  display: grid;
  gap: 0;
  border: 1px solid var(--gold-hair);
}
.hl-grid--4 { grid-template-columns: repeat(4, 1fr); }
.hl-grid--3 { grid-template-columns: repeat(3, 1fr); }
.hl-grid--2 { grid-template-columns: repeat(2, 1fr); }
.hl-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 30px 22px 32px;
  border-right: 1px solid var(--gold-hair);
}
.hl-grid--4 .hl-card:nth-child(4n),
.hl-grid--3 .hl-card:nth-child(3n),
.hl-grid--2 .hl-card:nth-child(2n) { border-right: none; }
.hl-card-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px; height: 46px;
  margin-bottom: 16px;
  color: var(--gold-deep);
}
.hl-card-icon .line-icon { width: 30px; height: 30px; }
.hl-card-label {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 12px;
}
.hl-card-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.86rem;
  line-height: 1.6;
  color: var(--ink-mute);
}

/* ============================================================
   EXPANDABLE SUBHEADING (ACCORDION) RESOURCE ROWS
   ============================================================ */
.policy-item.accordion { display: block; padding: 0; border-bottom: 1px solid var(--rule); }
.policy-item.accordion:hover { background: transparent; }
.policy-item-toggle {
  display: grid;
  grid-template-columns: 32px 1fr auto 20px;
  gap: 20px;
  align-items: center;
  width: 100%;
  padding: 15px 4px;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
  transition: background 0.12s;
  border-radius: 2px;
}
.policy-item-toggle:hover { background: var(--paper-warm); }
.policy-item-toggle:focus-visible { outline: 2px solid var(--gold-hair); outline-offset: 2px; }
.policy-item-toggle .policy-symbol { color: var(--gold-deep); opacity: 0.85; }
.policy-item-toggle .policy-symbol .line-icon { width: 18px; height: 18px; }
.policy-item-toggle .policy-name {
  font-family: 'MO Exceptional', serif;
  font-size: 0.98rem;
  color: var(--ink);
  font-weight: 500;
  line-height: 1.35;
}
.policy-item-toggle .policy-kind {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
}
.policy-chevron { color: var(--gold-deep); display: flex; align-items: center; justify-content: center; }
.policy-chevron .line-icon { width: 16px; height: 16px; transition: transform 0.25s ease; }
.policy-item.accordion[data-open="true"] .policy-chevron .line-icon { transform: rotate(180deg); }
.policy-item.accordion[data-open="true"] > .policy-item-toggle { background: var(--paper-warm); }

.policy-item-panel {
  overflow: hidden;
  animation: accGrow 0.28s ease;
}
@keyframes accGrow { from { opacity: 0; } to { opacity: 1; } }
.policy-item-panel-inner {
  padding: 4px 4px 22px 52px;
  border-left: 2px solid var(--gold-hair);
  margin-left: 15px;
}
.policy-item-blurb {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--ink-body);
  margin: 0 0 16px;
}
.policy-item-resource { display: flex; flex-direction: column; gap: 8px; }
.resource-eyebrow {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.58rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ink-fade);
}
.resource-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.92rem;
  color: var(--gold-deep);
  border-bottom: none;
  padding: 8px 14px;
  background: var(--paper-warm);
  border: 1px solid var(--gold-hair);
  border-radius: 3px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  width: fit-content;
  max-width: 100%;
}
a.resource-link:hover {
  background: var(--gold-deep);
  border-color: var(--gold-deep);
  color: #fff;
}
.resource-link-icon { display: flex; align-items: center; flex-shrink: 0; }
.resource-link-icon .line-icon { width: 15px; height: 15px; }
.resource-link-text { line-height: 1.35; }
.resource-link--none {
  color: var(--ink-mute);
  background: transparent;
  border-style: dashed;
  cursor: default;
  flex-wrap: wrap;
}
.resource-link-note {
  font-size: 0.66rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-fade);
  margin-left: 4px;
}
.policy-item.static { border-bottom: 1px solid var(--rule); }

@media (max-width: 640px) {
  .policy-item-toggle { grid-template-columns: 24px 1fr 20px; gap: 12px; }
  .policy-item-toggle .policy-kind { display: none; }
  .policy-item-panel-inner { padding-left: 36px; margin-left: 12px; }
}

/* ============================================================
   PURPOSE / SYMBOLS / MISC
   ============================================================ */
.purpose-list { list-style: none; padding: 0; margin: 24px 0 0; }
.purpose-list li {
  padding: 14px 0;
  border-top: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 16px;
  align-items: baseline;
}
.purpose-list li:last-child { border-bottom: 1px solid var(--rule); }
.purpose-list .num {
  font-family: 'MO Exceptional', serif;
  font-style: italic;
  font-size: 0.9rem;
  color: var(--gold-deep);
  letter-spacing: 0.1em;
}
.purpose-list .txt { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.95rem; line-height: 1.65; color: var(--ink-body); }

.symbol-legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px 40px;
  margin-top: 32px;
}
.symbol-item {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 16px;
  padding: 20px 0;
  border-top: 1px solid var(--rule);
}
.symbol-item .sym { text-align: center; line-height: 1; margin-top: 2px; opacity: 0.85; color: var(--gold-deep); }
.symbol-item .sym .line-icon { width: 22px; height: 22px; margin: 0 auto; }
.symbol-item h4 { font-family: 'MO Exceptional', serif; font-size: 1rem; color: var(--ink); text-transform: none; letter-spacing: 0; margin-bottom: 6px; font-weight: 500; }
.symbol-item p { font-size: 0.82rem; color: var(--ink-mute); margin: 0; line-height: 1.55; }

/* Values grid */
.values-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  margin-top: 32px;
}
.value-block {
  padding: 32px 0;
  border-top: 1px solid var(--gold-hair);
}
.value-block h3 { font-family: 'MO Exceptional', serif; font-size: 1.5rem; font-style: italic; color: var(--ink); margin-bottom: 16px; font-weight: 500; }
.value-block p { font-size: 0.95rem; line-height: 1.7; color: var(--ink-body); }

/* Data callout — for stats / links */
.stat-callout {
  text-align: center;
  padding: 40px 24px;
  margin: 32px 0;
  border-top: 1px solid var(--gold-hair);
  border-bottom: 1px solid var(--gold-hair);
}
.stat-callout .stat-num { font-family: 'MO Exceptional', serif; font-size: 3.5rem; font-weight: 500; color: var(--ink); line-height: 1; }
.stat-callout .stat-label { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.7rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-mute); margin-top: 12px; }

/* ============================================================
   VISUAL CONTENTS MENU — photo cards
   ============================================================ */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-top: 48px;
}
.menu-card {
  display: block;
  text-align: left;
  background: var(--paper);
  border: 1px solid var(--rule);
  transition: border-color 0.2s ease, box-shadow 0.25s ease, transform 0.25s ease;
}
.menu-card:hover {
  border-color: var(--gold-hair);
  box-shadow: var(--shadow-card);
  transform: translateY(-3px);
}
.menu-card-img {
  overflow: hidden;
  aspect-ratio: 16/10;
  background: var(--paper-tint);
}
.menu-card-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.6s ease;
}
.menu-card:hover .menu-card-img img { transform: scale(1.04); }
.menu-card-body { padding: 22px 24px 26px; }
.menu-card-eyebrow {
  display: flex; align-items: center;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 10px;
}
.menu-card-icon { display: inline-flex; margin-right: 10px; color: var(--gold-deep); }
.menu-card-icon .line-icon { width: 18px; height: 18px; }
.menu-card-title {
  font-family: 'MO Exceptional', serif;
  font-size: 1.25rem;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.2;
  margin-bottom: 8px;
}
.menu-card-desc {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.8rem;
  color: var(--ink-mute);
  line-height: 1.55;
}
/* Cover CTA — into the visual contents menu */
.cover-cta {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 28px;
  padding: 14px 26px;
  border: 1px solid rgba(247,244,238,0.55);
  color: #f7f4ee;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.cover-cta:hover { background: rgba(247,244,238,0.12); border-color: var(--gold-hair); color: #fff; }

/* Floating "back to contents" button */
.menu-fab {
  position: fixed;
  right: 28px; bottom: 28px;
  z-index: 400;
  display: flex; align-items: center; gap: 9px;
  padding: 12px 20px;
  background: var(--ink);
  color: #f2ead9;
  border: 1px solid rgba(201,168,121,0.45);
  border-radius: 999px;
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.66rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  box-shadow: 0 6px 24px rgba(13,11,8,0.22);
  transition: background 0.2s, color 0.2s, opacity 0.25s, transform 0.25s;
}
.menu-fab:hover { background: #000; color: var(--gold-hair); }
.menu-fab.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }

/* Heritage timeline — vertical gold spine with milestone nodes */
.timeline {
  position: relative;
  padding: 8px 0 8px 40px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 11px; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent 0%, var(--gold-hair) 8%, var(--gold-hair) 92%, transparent 100%);
}
.timeline-item {
  position: relative;
  padding: 26px 0;
}
.timeline-item + .timeline-item { border-top: 1px solid var(--rule); }
.timeline-item--media {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 34px;
  align-items: center;
}
.timeline-item--media.timeline-item--wide {
  grid-template-columns: 1fr;
  gap: 24px;
}
.timeline-media {
  margin: 0;
  overflow: hidden;
  border: 1px solid var(--rule);
  box-shadow: 0 14px 34px -22px rgba(20, 15, 8, 0.55);
}
.timeline-media img {
  display: block;
  width: 100%;
  height: 200px;
  object-fit: cover;
  object-position: center;
  filter: sepia(0.32) contrast(1.02) brightness(1.02);
}
.timeline-media--wide img {
  height: auto;
  max-height: 460px;
  object-fit: contain;
  background: var(--paper-tint);
  filter: none;
}
.timeline-item--media .timeline-note { max-width: none; }
.timeline-node {
  position: absolute;
  left: -33px; top: 44px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--gold-deep);
}
.timeline-node::after {
  content: '';
  position: absolute;
  inset: 2.5px;
  border-radius: 50%;
  background: var(--gold-deep);
}
.timeline-year {
  font-family: 'MO Exceptional', serif;
  font-size: 2.6rem;
  font-weight: 500;
  color: var(--ink);
  line-height: 1;
}
.timeline-label {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-top: 10px;
}
.timeline-note {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.85rem;
  font-style: italic;
  color: var(--ink-mute);
  line-height: 1.6;
  margin-top: 8px;
  max-width: 380px;
}

/* ── Global Presence · portfolio grid ───────────────────────── */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 44px;
}
.portfolio-card {
  background: var(--paper);
  padding: 34px 26px 30px;
  text-align: center;
  transition: background 0.35s ease;
}
.portfolio-card:hover { background: var(--paper-warm); }
.portfolio-icon {
  color: var(--gold-deep);
  width: 48px; height: 48px;
  margin: 0 auto 20px;
}
.portfolio-icon svg { width: 100%; height: 100%; display: block; }
.portfolio-name {
  font-family: 'MO Exceptional', serif;
  font-size: 1.28rem;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.01em;
}
.portfolio-desc {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.82rem;
  line-height: 1.6;
  color: var(--ink-mute);
  margin-top: 12px;
}
.place-statement {
  display: flex;
  align-items: flex-start;
  gap: 22px;
  margin-top: 40px;
  padding: 30px 34px;
  background: var(--paper-tint);
  border-left: 2px solid var(--gold);
}
.place-mark {
  flex: none;
  color: var(--gold-deep);
  width: 38px; height: 38px;
  margin-top: 2px;
}
.place-mark svg { width: 100%; height: 100%; display: block; }
.place-text {
  font-family: 'MO Exceptional', serif;
  font-size: 1.22rem;
  line-height: 1.62;
  color: var(--ink-body);
  margin: 0;
}
.place-text em { font-style: italic; color: var(--gold-deep); }

/* ── Operations · operating model ───────────────────────────── */
.ops-model {
  margin-top: 44px;
  border: 1px solid var(--rule);
  background: var(--paper);
}
.ops-model-head {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-deep);
  text-align: center;
  padding: 22px 0 20px;
  border-bottom: 1px solid var(--rule);
}
.ops-pillars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.ops-pillar {
  padding: 34px 24px 30px;
  text-align: center;
  border-right: 1px solid var(--rule);
}
.ops-pillar:last-child { border-right: none; }
.ops-icon {
  color: var(--gold-deep);
  width: 46px; height: 46px;
  margin: 0 auto 18px;
}
.ops-icon svg { width: 100%; height: 100%; display: block; }
.ops-name {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 600;
}
.ops-desc {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.8rem;
  line-height: 1.58;
  color: var(--ink-mute);
  margin-top: 11px;
}
.ops-pc-band {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 26px 34px;
  border-top: 1px solid var(--rule);
  background: var(--paper-tint);
}
.ops-pc-icon {
  flex: none;
  color: var(--gold-deep);
  width: 40px; height: 40px;
}
.ops-pc-icon svg { width: 100%; height: 100%; display: block; }
.ops-pc-text {
  font-family: 'Avenir Next LT Pro', sans-serif;
  font-size: 0.92rem;
  line-height: 1.62;
  color: var(--ink-body);
  margin: 0;
}
.ops-pc-label {
  font-family: 'MO Exceptional', serif;
  font-size: 1.02rem;
  color: var(--gold-deep);
  font-style: italic;
}

/* Chapter navigator (bottom of each chapter) */
.chapter-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 40px 80px 80px;
  border-top: 1px solid var(--rule);
  gap: 24px;
  max-width: 1200px;
  margin: 40px auto 0;
}
.nav-btn {
  border: none; background: transparent; text-align: left; padding: 0; cursor: pointer;
  color: var(--ink-body);
  transition: color 0.15s;
}
.nav-btn:hover { color: var(--gold-deep); }
.nav-btn.right { text-align: right; }
.nav-btn .eyebrow { font-family: 'Avenir Next LT Pro', sans-serif; font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 8px; }
.nav-btn .title { font-family: 'MO Exceptional', serif; font-size: 1.15rem; font-weight: 500; }

/* Utility */
.center { text-align: center; }
.mt-32 { margin-top: 32px; }
.mt-48 { margin-top: 48px; }
.mt-64 { margin-top: 64px; }
.mb-32 { margin-bottom: 32px; }

/* Highlight from search */
mark {
  background: linear-gradient(180deg, transparent 55%, rgba(201, 168, 121, 0.35) 55%);
  color: inherit;
  padding: 0 1px;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1100px) {
  .spread { padding: 56px 48px; }
  .cols-2 { gap: 32px; }
  .wheel-legend { grid-template-columns: repeat(2, 1fr); }
  .menu-grid { grid-template-columns: 1fr; }
  .cpo-spread { grid-template-columns: 320px 1fr; gap: 40px; }
  .leaders-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 900px) {
  .wheel-layout { grid-template-columns: 1fr; gap: 8px; max-width: 560px; }
  .wheel-caption { min-height: 0; justify-content: center; text-align: center; }
  .wheel-caption-inner { border-left: none; border-top: 2px solid var(--gold-hair); padding: 22px 0 0; }
  .wheel-caption--rest { border-top-color: var(--rule); }
  .wheel-caption-desc { max-width: 46ch; margin-left: auto; margin-right: auto; }
  .wheel-caption-icon { display: none; }
  .topbar { grid-template-columns: minmax(0, 1fr) auto; }
  .running-header { display: none; }
  .brand-wordmark { display: none; }
  /* Prevent the right cluster (language switch + search) from blowing out the bar */
  .brand-left, .brand-right { min-width: 0; }
  .brand-right { flex: 0 1 auto; }
  .search { min-width: 0; }
  .lang-switch { flex: 0 1 auto; min-width: 0; max-width: 150px; text-overflow: ellipsis; margin-right: 8px; }
  .layout { grid-template-columns: 1fr; }
  .rail {
    position: fixed;
    top: 66px;
    left: 0; width: 280px;
    height: calc(100vh - 66px);
    transform: translateX(-100%);
    transition: transform 0.25s;
    z-index: 90;
    box-shadow: var(--shadow-card);
  }
  .rail.on { transform: none; }
  .rail-toggle {
    display: flex;
    align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--rule);
    background: var(--paper);
    border-radius: 2px;
  }
  .cpo-spread { grid-template-columns: 1fr; gap: 32px; }
  .cpo-portrait-wrap { max-width: 300px; margin: 0 auto; }
  .cols-2 { grid-template-columns: 1fr; }
  .leaders-grid { grid-template-columns: repeat(3, 1fr); }
  .leaders-grid--pc { grid-template-columns: repeat(4, 1fr); max-width: 640px; }
  .vp-branches { grid-template-columns: 1fr; gap: 40px; }
  .vp-branches::before { display: none; }
  .vp-branch::before { display: none; }
  .symbol-legend { grid-template-columns: 1fr; }
  .values-grid { grid-template-columns: 1fr; gap: 0; }
  .beliefs-tabs { gap: 24px; }
  .beliefs-tab { font-size: 1.2rem; padding-bottom: 12px; }
  .beliefs-panel { grid-template-columns: 1fr; gap: 28px; }
  .beliefs-statement-col { padding: 30px 26px; }
  .beliefs-statement { font-size: 1.7rem; }
  .timeline-item--media { grid-template-columns: 1fr; gap: 18px; }
  .timeline-media img { height: 210px; }
  .timeline-media--wide img { height: auto; }
  .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
  .ops-pillars { grid-template-columns: repeat(2, 1fr); }
  .ops-pillar:nth-child(2) { border-right: none; }
  .ops-pillar:nth-child(1), .ops-pillar:nth-child(2) { border-bottom: 1px solid var(--rule); }
  .ops-pc-band { flex-direction: column; align-items: flex-start; gap: 14px; }
  .place-statement { flex-direction: column; gap: 16px; }
  .spread { padding: 40px 24px; }
  .opener-content { padding: 32px 24px; }
  .opener-top { flex-direction: column; gap: 14px; }
  .opener-top-left { gap: 14px; }
  .opener-eyebrow { text-align: left; padding-top: 0; }
  .opener-back { padding: 8px 15px 8px 12px; font-size: 0.58rem; }
  .sub-hero-caption { left: 24px; right: 24px; bottom: 24px; flex-direction: column; align-items: flex-start; }
  .sub-hero-caption .letter { font-size: 3rem; }
  .sub-hero-caption h2 { font-size: 2rem; }
  .chapter-nav { padding: 32px 24px 48px; }
  .search { width: 180px; }
  /* Highlight icon-card grid reflows to two columns on tablets */
  .hl-grid--4, .hl-grid--3 { grid-template-columns: repeat(2, 1fr); }
  .hl-grid--4 .hl-card, .hl-grid--3 .hl-card { border-right: 1px solid var(--gold-hair); border-bottom: 1px solid var(--gold-hair); }
  .hl-grid--4 .hl-card:nth-child(2n), .hl-grid--3 .hl-card:nth-child(2n) { border-right: none; }
  .hl-grid--4 .hl-card:nth-last-child(-n+1), .hl-grid--3 .hl-card:nth-last-child(-n+1) { border-bottom: none; }
  /* CH4 milestone timeline + philosophy spread stack on tablet/mobile */
  .mstone-grid { grid-template-columns: 1fr; gap: 34px; }
  .mstone-left { position: static; top: auto; }
  .philosophy-ensure-list { grid-template-columns: 1fr; }
  .editorial-band--full .editorial-band-cap { padding: 0 24px; }
  /* CH5 audit orbit diagram stacks below the text on tablet/mobile */
  .orbit { padding: 32px 24px; height: auto; }
  .orbit-stage svg { max-width: 300px; }
}
@media (min-width: 901px) { .rail-toggle { display: none; } }

@media (max-width: 560px) {
  .brand-sub, .brand-title { display: none; }
  .leaders-grid { grid-template-columns: repeat(2, 1fr); }
  .leaders-grid--pc { grid-template-columns: repeat(2, 1fr); }
  .portfolio-grid { grid-template-columns: 1fr; }
  .bookmark-btn span { display: none; }
  .opener-title { font-size: 2.4rem; }
  .search { width: 140px; }
  .search-hint { display: none; }
  /* Phones: shrink the language switch so the bar never exceeds the viewport */
  .lang-switch { max-width: 108px; padding: 7px 8px; font-size: 10.5px; }
  /* Editorial band caption stacks vertically on phones */
  .editorial-band-cap { flex-direction: column; gap: 6px; }
  .editorial-band-eyebrow::after { display: none; }
  .editorial-band-img { aspect-ratio: 4 / 3; }
  /* Slightly smaller section pull-quote on phones */
  .section-quote-text { font-size: 1.2rem; }
  .section-quote-mark { font-size: 4rem; height: 34px; }
  /* Highlight icon-card grid stacks on phones */
  .hl-grid--4, .hl-grid--3, .hl-grid--2 { grid-template-columns: 1fr; }
  .hl-card { border-right: none !important; border-bottom: 1px solid var(--gold-hair); }
  .hl-card:last-child { border-bottom: none; }
}

/* Print (hint) */
@media print {
  .topbar, .rail, .chapter-nav, .progress-bar { display: none; }
  .chapter { display: block !important; page-break-after: always; }
}

/* Task list context card (V5 dark panel beside the tasks) */
.pb-tl-wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start;}
.pb-tl-card{background:var(--ink);color:var(--mo-ivory);border-radius:14px;padding:24px;position:sticky;top:24px;}
.pb-tl-card-lbl{font-size:10px;letter-spacing:.26em;color:var(--celadon);text-transform:uppercase;margin:14px 0 4px;font-weight:700;}
.pb-tl-card-lbl:first-child{margin-top:0;}
.pb-tl-card-val{font-size:14px;line-height:1.55;color:#EDEAE3;}
.pb-tl-card-val em{color:var(--celadon);font-style:normal;}
.pb-tl-card-progress{margin-top:20px;}
.pb-tl-card-bar{height:4px;background:#3d3a34;border-radius:2px;overflow:hidden;}
.pb-tl-card-fill{height:100%;background:var(--gold);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1);}
.pb-tl-card-count{font-size:11px;letter-spacing:.18em;color:var(--celadon);margin-top:9px;text-transform:uppercase;}
@media(max-width:880px){
  .pb-tl-wrap{grid-template-columns:1fr;}
  .pb-tl-card{position:static;}
}
</style>
</head>
